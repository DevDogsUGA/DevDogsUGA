# Which dependencies' install scripts may run — pnpm 11's per-dep decision
# map (it migrated the four `true`s from onlyBuiltDependencies below and
# inserted the core-js placeholder itself). `false` is a decision, not an
# omission: core-js (via @bitwarden/cli) postinstalls a funding banner and
# nothing the package needs to work. supabase is `true` here for the same
# reason it is in the older list — its postinstall fetches the CLI binary.
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
  workerd: true
# undici 6 (via @discordjs/rest) starts compiling its llhttp Wasm AT MODULE
# SCOPE — `llhttpPromise = lazyllhttp()` guarded by an argument-LESS
# `.catch()`, which swallows nothing — and the Workers runtime forbids
# runtime Wasm codegen, so merely importing the library rejected every
# platform page render with an unhandled CompileError (2026-08-20). undici 7
# instantiates llhttp lazily and synchronously on first socket connect,
# which the fetch-based transports never reach. @discordjs/rest uses only
# Headers/request/FormData — all unchanged in 7 — and cheerio already pulls
# 7.28 into this tree.
overrides:
  undici: ^7.28.0
# Single source of truth for every dependency used by more than one workspace
# package. Packages reference these with "catalog:" instead of a literal range,
# so a shared version can only ever be bumped here. Deps used by exactly one
# package stay as literal ranges in that package's package.json.
catalog:
  # --- Framework / runtime ---
  next: ^16.3.1
  react: ^19.2.8
  react-dom: ^19.2.8

  # --- Supabase ---
  "@supabase/ssr": ^0.12.4
  "@supabase/supabase-js": ^2.112.0

  # --- Radix ---
  # Kept on one release train even where a package is currently used by only
  # one app: mixing trains duplicates the shared internals (dismissable-layer,
  # popper, portal) in the bundle.
  "@radix-ui/react-accordion": ^1.2.20
  "@radix-ui/react-alert-dialog": ^1.1.23
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-collapsible": ^1.1.20
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-hover-card": ^1.1.23
  "@radix-ui/react-popover": ^1.1.23
  "@radix-ui/react-select": ^2.3.7
  "@radix-ui/react-toast": ^1.2.23
  "@radix-ui/react-tooltip": ^1.2.16
  radix-ui: ^1.6.7

  # --- Data ---
  # drizzle-orm/-kit stay pinned exact on the 1.0.0-rc line; the `latest`
  # dist-tag still points at 0.45.x, so a range here would silently downgrade.
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  postgres: ^3.4.9
  zod: 4.4.3
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-query-devtools": ^5.101.4

  # --- App libraries ---
  "@t3-oss/env-nextjs": ^0.13.11
  date-fns: ^4.4.0
  motion: ^12.43.0
  papaparse: ^5.5.4

  # --- Styling ---
  "@tailwindcss/forms": ^0.5.11
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.25
  tailwindcss: ^4.3.3

  # --- Toolchain ---
  # eslint is held at 9.x on purpose: eslint-plugin-react (via
  # eslint-config-next) is not compatible with eslint 10.
  # typescript is held at 6.x on purpose: typescript-eslint peer-requires
  # ">=4.8.4 <6.1.0", so TS 7 breaks linting in every package.
  "@clack/prompts": ^1.7.0
  "@opennextjs/cloudflare": ^1.20.2
  eslint: ^10.8.1
  supabase: ^2.111.0
  tsx: ^4.23.5
  typescript: ^6.0.3
  wrangler: ^4.118.0

  # --- Testing ---
  # jsdom is held at 29.x on purpose: 30.x raises its floor to node
  # ^22.22.2 || ^24.15.0 || >=26, which is narrower than this repo's
  # declared engines.node (">=20"). Bump engines first, then jsdom.
  # vitest is held at 4.x on purpose: 5.x is still on the beta dist-tag.
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.4
  "@vitest/coverage-v8": ^4.1.10
  jsdom: ^29.1.1
  vitest: ^4.1.10

  # --- Types ---
  "@types/node": ^26.1.2
  "@types/papaparse": ^5.5.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
