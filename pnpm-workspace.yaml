onlyBuiltDependencies:
  - esbuild
  - sharp
  - supabase
  - unrs-resolver
  - workerd
packages:
  - apps/*
  - packages/*
  # The documentation content itself. Being a package (rather than a bare
  # folder) is what lets `turbo watch` see doc edits at package granularity and
  # lets the platform pick up the parsed output through the existing `^build`
  # dependency — no root task, no bespoke file watcher.
  - docs

# Run package.json scripts through pnpm's built-in JS shell (@yarnpkg/shell)
# instead of the platform shell. It implements the POSIX subset these scripts
# need — $VAR, ${VAR:-default}, &&, >, and KEY=VALUE prefixes — identically on
# Windows and POSIX, so no script needs an `sh -c` wrapper. Note it also globs
# unquoted [...] patterns; keep such arguments quoted.
shellEmulator: true
