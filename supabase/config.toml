project_id = "DevDogsUGA"

# Ports are literals, not "env(...)": `supabase seed` validates config.toml
# against a typed schema that only interpolates env() into *string* fields, so
# an env() in any numeric field makes it exit 1 (silently, under the with-env
# wrapper). Everything else in this file may still use env().
[api]
enabled = true
port = 54321
# `study_group_finder` is deliberately FIRST so it is PostgREST's default REST
# profile (the schema served at /rest/v1/ when no Accept-Profile header is sent).
# This lets the Flutter app's supadart codegen — which can't select a schema and
# only ever reads the default — generate `study_group_finder` models directly.
# Safe because every app's Supabase client sets its `db.schema` explicitly, so
# nothing relies on the default; `public` is intentionally empty. Do not reorder.
schemas = [
  "study_group_finder",
  "public",
  "graphql_public",
  "storage",
  "platform",
  "schedule_builder",
]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Seeds run on `supabase db reset` only, never on `db push` (a hosted tier is
# seeded by hand with `supabase db push --include-seed`, and Supabase records
# each file's hash in `supabase_migrations.seed_files` so an edited file is not
# run again). `roles/` is the role catalogue, one file per role; files run
# alphabetically. `**` does not search subfolders, so keep the folder flat.
#
# Every file is insert-only (`on conflict do nothing`): a rerun never
# overwrites what an admin has since edited.
#
# There is deliberately no `development/` set. It used to hold password-login
# personas, and because any reset runs this list, a reset of a hosted tier
# would have planted logins whose password is in the repo. Sign in through the
# app instead and give the account a role with `pnpm devtools roles grant`.
[db.seed]
enabled = true
sql_paths = ["./seed/roles/*.sql", "./seed/apps/*.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Explicitly off: the CLI's default is `enabled = true`, and `config push`
# pushes defaults too — a free-tier project answers 402 for vector buckets,
# which is how the first staging push failed. Nothing here uses them.
[storage.vector]
enabled = false

[storage.buckets.avatars]
public = true
file_size_limit = "256KiB"
allowed_mime_types = ["image/webp"]
# The DogDays and DogPack app icons (apps/<name>.webp): `backstage deploy
# avatars` uploads what the bucket lacks. The seed that sets their `logoPath`
# is seed/apps/logos.sql.
objects_path = "./seed/app-icons"

[auth]
enabled = true
site_url = "env(BASE_URL)"
# `env(...)` is substituted only when it is the ENTIRE value — the CLI matches
# it anchored — so "env(BASE_URL)/auth/callback" would be passed through
# verbatim. Each callback URL therefore gets its own variable, composed from
# BASE_URL in the root .env.
#
# The Dog Pack mobile app returns through its own URL scheme instead, the same
# on every environment, so it is a literal: the Android intent filter and iOS
# CFBundleURLTypes in apps/study-group-finder register the matching scheme.
additional_redirect_urls = [
  "env(BASE_URL_CALLBACK)",
  "dev.dogpack://login-callback",
]
enable_manual_linking = true

# Password sign-up is off: OAuth (Discord/GitHub/Google/LinkedIn) is the only
# supported way to create an account. Deliberately NOT `[auth.email]
# enable_signup = false` — gotrue has one flag per provider
# (`EmailProviderConfiguration.Enabled`), and it gates password SIGN-IN too
# (`internal/api/token.go`'s password grant checks the same flag
# `internal/api/signup.go` does), which would lock every password test
# login out of the only sign-in path the local Docker
# stack has (plain HTTP, so it cannot host OAuth). Password
# signup is refused instead by `require_uga_signup_email` (the
# before-user-created hook below), extended to reject the `email` provider
# outright — see 20260924070955_30_auth_disable_email_signup.sql for why
# that is the one boundary that can tell "POSTed /auth/v1/signup with a
# password" apart from "an OAuth provider vouched for this identity" without
# also touching sign-in.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/platform/require_uga_signup_email"

# Tokens issued to "Sign in with DevDogs" clients, of either tier, are re-roled
# to `oauth_identity` (no data access through PostgREST). Who may sign in to a
# client is decided at consent, not here. Every other token passes through
# unchanged. See 20261011130000_57_platform_oauth_tiers.sql.
#
# That does not stop GoTrue itself from honouring such a token (or the client's
# ID token, which no hook sees) at /auth/v1/user; the password and identity-link
# guards in 20261012130000_61_platform_oauth_token_guards.sql do.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/platform/restrict_oauth_tokens"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"

[auth.external.discord]
enabled = true
client_id = "env(DISCORD_CLIENT_ID)"
secret = "env(DISCORD_CLIENT_SECRET)"

[auth.external.github]
enabled = true
client_id = "env(GH_CLIENT_ID)"
secret = "env(GH_CLIENT_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.linkedin_oidc]
enabled = true
client_id = "env(LINKEDIN_CLIENT_ID)"
secret = "env(LINKEDIN_CLIENT_SECRET)"

[analytics]
enabled = false

# The declarative schema tree (supabase/schemas/) is read and written by the
# bundled pg-delta engine: `supabase db schema declarative generate|sync`.
# supabase/migrations/ is the baseline it diffs against.
[experimental.pgdelta]
enabled = true
