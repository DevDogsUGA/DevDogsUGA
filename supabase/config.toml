project_id = "DevDogs-Website"

# Ports are literals, not "env(...)": `supabase seed` validates config.toml
# against a typed schema that only interpolates env() into *string* fields, so
# an env() in any numeric field makes it exit 1 (silently, under the with-env
# wrapper). Everything else in this file may still use env().
[api]
enabled = true
port = 54321
# `study_group_finder` is deliberately FIRST so it is PostgREST's default REST
# profile (the schema served at /rest/v1/ when no Accept-Profile header is sent).
# This lets the Flutter app's supadart codegen — which can't select a schema and
# only ever reads the default — generate `study_group_finder` models directly.
# Safe because every app's Supabase client sets its `db.schema` explicitly, so
# nothing relies on the default; `public` is intentionally empty. Do not reorder.
schemas = [
  "study_group_finder",
  "public",
  "graphql_public",
  "storage",
  "platform",
  "schedule_builder",
]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Seeds run on `supabase db reset` only, never on `db push`, so they are the
# safe place to open the development-only gate: a reset is by definition
# pointed at a local stack or a contributor's own project. A directory glob
# rather than the default single `./seed.sql` because seeds are split by
# concern and applied in filename order.
[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "256KiB"
allowed_mime_types = ["image/webp"]

[auth]
enabled = true
site_url = "env(BASE_URL)"
# `env(...)` is substituted only when it is the ENTIRE value — the CLI matches
# it anchored — so "env(BASE_URL)/auth/callback" would be passed through
# verbatim. Each callback URL therefore gets its own variable, composed from
# BASE_URL / SCHEDULE_BUILDER_URL / STUDY_GROUP_FINDER_URL in the root .env.
# The third (Dog Pack, dogpack.dev) has no web deployment yet: its variable
# stays unset, which the CLI treats as a WARN and an absent entry, so the
# allowlist gains the origin the day the value is filled and not before.
additional_redirect_urls = [
  "env(BASE_URL_CALLBACK)",
  "env(SCHEDULE_BUILDER_URL_CALLBACK)",
  "env(STUDY_GROUP_FINDER_URL_CALLBACK)",
]
enable_manual_linking = true

# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"

[auth.external.discord]
enabled = true
client_id = "env(DISCORD_CLIENT_ID)"
secret = "env(DISCORD_CLIENT_SECRET)"

[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.linkedin_oidc]
enabled = true
client_id = "env(LINKEDIN_CLIENT_ID)"
secret = "env(LINKEDIN_CLIENT_SECRET)"

[analytics]
enabled = false
