name: Start the local Supabase stack
description: >-
  Starts the stack from the repo's supabase/ (applying every migration to a
  fresh database), with the Docker images restored from and saved to the
  Actions cache. Shared by the `types` and `database` jobs.

# Needs setup-workspace to have run (the CLI is one of the root's
# dependencies).
#
# `supabase start` pulls about a dozen images, all chosen by the CLI version
# (and which services the config enables), so they are cached as one
# `docker save` archive under exactly that key. A hit is a `docker load` and
# the CLI finds every image already present. PRs restore only: main saves
# the archive once instead of every PR consuming another ~1.3 GB.
runs:
  using: composite
  steps:
    - name: Supabase CLI version
      id: cli
      shell: bash
      run: |
        version=$(pnpm exec supabase --version | tail -n 1)
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Restore the Supabase images
      id: images
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/supabase-images
        key: supabase-images-${{ runner.os }}-${{ steps.cli.outputs.version }}-${{ hashFiles('supabase/config.toml') }}
    - name: Load the cached images
      if: steps.images.outputs.cache-hit == 'true'
      shell: bash
      run: docker load --input ~/.cache/supabase-images/images.tar
    # The stack binds fixed host ports (54320-54329), inside Linux's
    # ephemeral range (32768-60999), from which the kernel picks the local
    # port of every outgoing connection. When one of them, such as a
    # connection Docker keeps open after an image pull, holds a stack port,
    # `supabase start` fails with "address already in use". Reserving the
    # block stops the kernel from handing those ports out; binding them
    # explicitly still works.
    - name: Reserve the stack's ports
      shell: bash
      run: |
        echo "ephemeral range: $(cat /proc/sys/net/ipv4/ip_local_port_range)"
        sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
    # config.toml enables OAuth providers with `env()` credentials that CI
    # does not have; an unset one is a WARN, not an error.
    - name: Start the local Supabase stack
      shell: bash
      run: pnpm exec supabase start
    - name: Save the Supabase images
      if: steps.images.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule')
      shell: bash
      run: |
        mkdir -p ~/.cache/supabase-images
        docker save --output ~/.cache/supabase-images/images.tar \
          $(docker ps --format '{{.Image}}' | sort -u)
    - name: Cache the Supabase images
      if: steps.images.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/supabase-images
        key: ${{ steps.images.outputs.cache-primary-key }}
