name: Set up the workspace
description: >-
  The post-checkout bootstrap every job shares: enable corepack (pnpm), set up
  Node from .nvmrc with a pnpm cache, and install with a frozen lockfile.

# Checkout is not here, and cannot be: a local composite action
# (`uses: ./.github/actions/…`) only resolves after the repository is on disk,
# because the action's own files live in it. So `actions/checkout` stays in
# each job, which is also where its `fetch-depth` belongs (`0` for the jobs
# that diff against a base ref, or need both ends of a push; the default
# elsewhere).
#
# The setup-node pin keeps its `# v4` trailing comment so Renovate and
# Dependabot update it here the same way they do the `uses:` pins in the
# workflows.
runs:
  using: composite
  steps:
    - name: Enable corepack (pnpm)
      run: corepack enable
      shell: bash
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        package-manager-cache: false # cache-pnpm caches, from main only
        node-version-file: .nvmrc
    - uses: ./.github/actions/cache-pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
    - name: Save the shared pnpm store
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
