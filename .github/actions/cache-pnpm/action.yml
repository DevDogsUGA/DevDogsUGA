name: Restore the pnpm store
description: Restore shared main caches without setup-node's unconditional post-save.
runs:
  using: composite
  steps:
    - id: store
      shell: bash
      run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    # PR merge refs each have their own quota-consuming cache namespace. Only
    # main writes; PRs and the merge queue can read main's entries.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-
