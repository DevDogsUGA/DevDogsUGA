name: Deploy

# Every main commit is validated and staged immediately, then becomes a
# production candidate. Production mutation is gated by the protected
# `production` environment and deploys this commit's prebuilt artifacts.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      prune_orphans:
        description: Delete undeclared production Worker secrets instead of deploying.
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  DEPLOY_ENV: staging

jobs:
  supersede:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only older candidates still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" --limit 50 --json databaseId,headSha \
            --jq ".[] | select(.databaseId != ($CURRENT_RUN | tonumber)) | .databaseId" |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            waiting=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name == "production" and .status == "waiting")] | length')
            if [ "$waiting" -gt 0 ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
            fi
          done

  # Staging moves to DevDogsUGA/Backstage (TASK-489). The cutover is two
  # repository variables flipped together: DEVDOGSUGA_DEPLOYS_STAGING=false
  # here and BACKSTAGE_DEPLOYS_STAGING=true there. Until then (unset) this
  # repo keeps deploying staging exactly as before.
  staging-preflight:
    if: >-
      github.event_name == 'push' && !inputs.prune_orphans
      && vars.DEVDOGSUGA_DEPLOYS_STAGING != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      paused: ${{ steps.probe.outputs.paused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - name: Classify the staging Supabase project
        id: probe
        env:
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
        run: pnpm backstage deploy preflight --no-env --yes

  staging-migrate:
    needs: staging-preflight
    if: needs.staging-preflight.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # --include-seed runs the seed files staging has not recorded yet; they
      # are insert-only, so a rerun or an edited file changes nothing there.
      - name: Apply staging migrations and new seeds
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: pnpm backstage deploy migrate --no-env --yes --include-seed
      # The seed SQL never touches Storage. This uploads only the headshots
      # the bucket lacks, so a photo an officer replaced is never overwritten.
      - name: Upload new seeded headshots
        env:
          API_URL: ${{ vars.API_URL }}
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pnpm backstage deploy avatars --no-env --yes

  staging-deploy:
    needs: [staging-preflight, staging-migrate]
    if: needs.staging-preflight.outputs.paused != 'true'
    uses: ./.github/workflows/deploy-app.yaml
    with:
      tier: staging
    secrets: inherit

  production-plan:
    if: github.event_name == 'push' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Verify the migration planner credential is read-only
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: pnpm backstage planner status --no-env --yes
      - name: Plan production migrations
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: >-
          pnpm backstage deploy plan --no-env --yes --include-seed
          --label 'Migration plan — production candidate'
      - name: Summarize candidate source
        run: |
          {
            echo '### Candidate source'
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/${{ github.event.before }}...$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  production-artifacts:
    if: github.event_name == 'push' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-build
    env:
      DEPLOY_ENV: production
      CLOUDFLARE_ENV: production
      SKIP_ENV_VALIDATION: "1"
      API_URL: ${{ vars.API_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
      PLATFORM_SENTRY_DSN: ${{ vars.PLATFORM_SENTRY_DSN }}
      SCHEDULE_BUILDER_SENTRY_DSN: ${{ vars.SCHEDULE_BUILDER_SENTRY_DSN }}
      NEXT_PUBLIC_DEPLOY_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
      NEXT_PUBLIC_PLATFORM_SENTRY_DSN: ${{ vars.PLATFORM_SENTRY_DSN }}
      NEXT_PUBLIC_SCHEDULE_BUILDER_SENTRY_DSN: ${{ vars.SCHEDULE_BUILDER_SENTRY_DSN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_AVATARS_BUCKET: avatars
      NEXT_PUBLIC_AUTH_MODE: google
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - name: Compose public build configuration
        run: |
          umask 077
          {
            printf 'API_URL="%s"\n' "$API_URL"
            printf 'BASE_URL="%s"\n' "$BASE_URL"
            printf 'PUBLISHABLE_KEY="%s"\n' "$PUBLISHABLE_KEY"
            printf 'PLATFORM_SENTRY_DSN="%s"\n' "$PLATFORM_SENTRY_DSN"
            printf 'SCHEDULE_BUILDER_SENTRY_DSN="%s"\n' "$SCHEDULE_BUILDER_SENTRY_DSN"
            printf 'NEXT_PUBLIC_DEPLOY_ENV="production"\n'
            printf 'NEXT_PUBLIC_SUPABASE_URL="%s"\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_PLATFORM_SENTRY_DSN="%s"\n' "$PLATFORM_SENTRY_DSN"
            printf 'NEXT_PUBLIC_SCHEDULE_BUILDER_SENTRY_DSN="%s"\n' "$SCHEDULE_BUILDER_SENTRY_DSN"
            printf 'NEXT_PUBLIC_TURNSTILE_SITE_KEY="%s"\n' "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
            printf 'NEXT_PUBLIC_AVATARS_BUCKET="avatars"\n'
            printf 'NEXT_PUBLIC_AUTH_MODE="google"\n'
          } > .env.production
      - name: Build production artifacts without production credentials
        run: |
          pnpm --filter platform run build
          BASE_URL=https://dogdays.dev pnpm --filter schedule-builder run build
      - name: Reject accidental placeholder or credential-shaped values
        run: |
          set -euo pipefail
          if rg -uuu -l 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|SUPABASE_DB_PASSWORD|CLOUDFLARE_API_TOKEN' apps/*/dist; then
            echo 'A production artifact contains credential-shaped material.' >&2
            exit 1
          fi
      - name: Hash the exact candidate
        run: |
          find apps/platform/dist apps/platform/.wrangler/deploy apps/schedule-builder/dist apps/schedule-builder/.wrangler/deploy docs/dist \
            -type f -print0 | sort -z | xargs -0 sha256sum > RELEASE_SHA256SUMS
          {
            echo '### Production artifacts'
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '```'
            cat RELEASE_SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # docs/dist is the docs build platform's prebuild generated; the
      # production job's `populate:search` indexes it, so the search index
      # matches the docs that shipped.
      - name: Upload immutable production candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-${{ github.sha }}
          path: |
            apps/platform/dist
            apps/platform/.wrangler/deploy
            apps/schedule-builder/dist
            apps/schedule-builder/.wrangler/deploy
            docs/dist
            RELEASE_SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  production:
    needs: [supersede, staging-deploy, production-plan, production-artifacts]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && (needs.staging-deploy.result == 'success' || vars.DEVDOGSUGA_DEPLOYS_STAGING == 'false')
      && needs.production-plan.result == 'success'
      && needs.production-artifacts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production
      cancel-in-progress: false
    environment: production
    env:
      DEPLOY_ENV: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - name: Refuse an approved candidate that is no longer main
        id: freshness
        run: |
          set -euo pipefail
          latest=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::Candidate $GITHUB_SHA was superseded by $latest; nothing was changed."
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
          else
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.freshness.outputs.fresh == 'true'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        if: steps.freshness.outputs.fresh == 'true'
      - name: Download approved production candidate
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-${{ github.sha }}
          path: .
      - name: Verify exact artifact hashes
        if: steps.freshness.outputs.fresh == 'true'
        run: sha256sum --check RELEASE_SHA256SUMS
      - name: Compose the production runtime environment
        if: steps.freshness.outputs.fresh == 'true'
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        run: pnpm backstage deploy write-env --no-env --yes
      # The Sentry release action runs in its own container and never sees the
      # file above, so the org slug is lifted into the job environment for it,
      # the smoke tests and the monitor prune. Same as deploy-app.yaml.
      - name: Export SENTRY_ORG from .env.production
        if: steps.freshness.outputs.fresh == 'true'
        run: grep -m1 '^SENTRY_ORG=' .env.production | tr -d "\"'" >> "$GITHUB_ENV"
      - name: Revalidate and apply migrations and new seeds
        if: steps.freshness.outputs.fresh == 'true'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          pnpm backstage deploy plan --no-env --yes --include-seed --label 'Approved migration plan — production'
          pnpm backstage deploy migrate --no-env --yes --include-seed
      - name: Upload new seeded headshots
        if: steps.freshness.outputs.fresh == 'true'
        env:
          API_URL: ${{ vars.API_URL }}
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pnpm backstage deploy avatars --no-env --yes
      - name: Apply Supabase configuration
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec with-env -c 'supabase config push --project-ref $PROJECT_REF'
      - name: Create Sentry release and upload platform source maps
        if: steps.freshness.outputs.fresh == 'true' && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_PROJECT: platform
        with:
          environment: production
          release: ${{ github.sha }}
          set_commits: skip
          sourcemaps: apps/platform/dist
      - name: Deploy and verify platform
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          pnpm backstage deploy platform --tier production --yes
          pnpm -F @devdogsuga/docs populate:search
      - name: Reconcile production configuration
        if: steps.freshness.outputs.fresh == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: pnpm backstage deploy reconcile --tier production --no-env --yes
      - name: Smoke test platform
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_PROJECT: platform
        run: pnpm backstage deploy smoke --tier production --yes --app platform --no-env
      # Deletes the Sentry Crons monitors the app no longer declares in
      # `cloudflare/scheduled.ts`. Sentry never removes a monitor itself, so a
      # renamed or dropped `monitorSlug` otherwise alerts on missed check-ins
      # every period (PLATFORM-2). After the smoke test, so it only runs once
      # this deploy's cron triggers are live. Production only: staging deploys
      # `main`, which can drop a monitor production still checks in to.
      #
      # SENTRY_MONITORS_TOKEN is in the step's `env:` alone, not the job's: it
      # can delete monitors and alert rules org-wide, and the deploy token (an
      # org token) cannot list or delete monitors at all. Without it the step
      # skips with a notice.
      - name: Prune Sentry monitors for platform
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_MONITORS_TOKEN: ${{ secrets.SENTRY_MONITORS_TOKEN }}
        run: pnpm backstage deploy prune-monitors --tier production --yes --app platform --no-env
      - name: Create Sentry release and upload schedule-builder source maps
        if: steps.freshness.outputs.fresh == 'true' && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_PROJECT: schedule-builder
        with:
          environment: production
          release: ${{ github.sha }}
          set_commits: skip
          sourcemaps: apps/schedule-builder/dist
      - name: Deploy and verify schedule-builder
        if: steps.freshness.outputs.fresh == 'true'
        run: pnpm backstage deploy schedule-builder --tier production --yes
      - name: Smoke test schedule-builder
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_PROJECT: schedule-builder
        run: pnpm backstage deploy smoke --tier production --yes --app schedule-builder --no-env
      - name: Prune Sentry monitors for schedule-builder
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_MONITORS_TOKEN: ${{ secrets.SENTRY_MONITORS_TOKEN }}
        run: pnpm backstage deploy prune-monitors --tier production --yes --app schedule-builder --no-env
      - name: Report orphaned Worker secrets
        if: steps.freshness.outputs.fresh == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm backstage env audit --target production --no-env --yes

  prune-orphans:
    if: github.event_name == 'workflow_dispatch' && inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - name: Prune orphaned Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm backstage env audit --target production --prune --yes --no-env
