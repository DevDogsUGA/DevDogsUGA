name: Deploy

# Every main commit is validated and staged immediately, then becomes a
# production candidate. Production mutation is gated by the protected
# `production` environment and deploys this commit's prebuilt artifacts.
#
# One repository. This commit is the whole deploy: the platform, the catalog,
# the migrations, seeds, avatars and docs all come from this checkout, and
# `workers.json` lists the Workers. (Until the fold-back this flow lived in
# Backstage and pinned DevDogsUGA by `devdogsuga.lock`.) What is particular here:
#
#   * The CLI is built from this commit (`.github/actions/backstage-cli`), not
#     fetched with `pnpm dlx`.
#   * The artifacts come from the merge queue. ci.yaml's `merge_group` run
#     builds both tiers (build-artifacts.yaml); `resolve` finds that run for
#     this exact SHA and the deploy jobs download its artifacts. A push the
#     queue never built (an admin bypass) is built here instead.
#   * Release names. Both Workers' Sentry release is this commit's SHA.
#   * The database and each Worker deploy through the shared building blocks
#     (deploy-database.yaml: plan, approve, hash-checked apply, the destructive
#     gate, the config push; deploy-worker.yaml: upload a version, smoke test
#     it, switch traffic, smoke test what is live). Product repositories call
#     the same two files pinned by commit SHA (Q15).
#   * Every approved production job opens with a self-approval gate (see
#     approval-gate.mjs) and refuses a candidate that is no longer main.
#
# ONE APPROVAL (opt-in). With the repository variable ONE_APPROVAL set to `true`
# production asks for approval once, not once per job: `production-plan` reads
# the database, `production-approval` (approve-production.yaml) is the single
# pause, in the reviewed `production-approval` environment, and everything after
# it (migrations, schema, config, both Workers) runs in `production`, which then
# has no reviewers. Unset, production asks per job exactly as before. The switch
# and its provisioning steps: docs/operations/deploys/one-approval.md.
#
# PHASE GATE. Until the production cutover to this repository, production
# still deploys from Backstage's copy of this flow and this one deploys STAGING
# only. Every production job (and the production build) is off unless the
# repository variable BACKSTAGE_DEPLOYS_PRODUCTION is exactly `true`; the
# variable does not exist yet. Setting it is the production cutover (README,
# "Deploys"), and is done at the Gate, not before.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      prune_orphans:
        description: Delete undeclared production Worker secrets instead of deploying.
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: read

env:
  DEPLOY_ENV: staging

jobs:
  supersede:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cancels an older CI run only when everything it is waiting on is a
      # production approval. This repo's CI run also carries the `publish`
      # job, which waits on its own environment: a run with any other waiting
      # job is left alone (its production jobs refuse to deploy a commit that
      # is no longer main anyway). This workflow is itself called by ci.yaml's
      # `deploy` job, and the jobs of a called workflow are named
      # `<caller job> / <job>`, so a production job reads
      # `deploy / production-database / apply` or
      # `deploy / production-platform / deploy`: the pattern matches a
      # `production-` segment after the start of the name or after ` / `.
      - name: Cancel only older candidates still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --event push \
            --limit 30 --json databaseId \
            --jq ".[] | select(.databaseId != ($CURRENT_RUN | tonumber)) | .databaseId" |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            read -r production other < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.status == "waiting") | (.name | test("(^| / )production-"))] as $w
                    | "\($w | map(select(.)) | length) \($w | map(select(. | not)) | length)"')
            if [ "$production" -gt 0 ] && [ "$other" -eq 0 ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
            fi
          done

  # What this deploy is made of, and where its artifacts are.
  resolve:
    if: github.event_name == 'push' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tiers: ${{ steps.tiers.outputs.tiers }}
      merge_group_run: ${{ steps.queue.outputs.run }}
      # `true` when the tier has something to ship (deploy-needed.mjs); a tier
      # that would redeploy what is live is skipped, approval and all.
      staging: ${{ steps.needed.outputs.staging }}
      production: ${{ steps.needed.outputs.production }}
      # What a routine deploy of each tier has to do (deploy-needed.mjs): the
      # config push and each Worker are skipped when nothing they depend on
      # changed since the tier's last deploy. `false` skips; anything else runs.
      staging_config: ${{ steps.needed.outputs.staging_config }}
      staging_platform: ${{ steps.needed.outputs.staging_platform }}
      staging_catalog: ${{ steps.needed.outputs.staging_catalog }}
      production_config: ${{ steps.needed.outputs.production_config }}
      production_platform: ${{ steps.needed.outputs.production_platform }}
      production_catalog: ${{ steps.needed.outputs.production_catalog }}
    steps:
      # Full history: deploy-needed diffs against each tier's last deploy.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Summarize the deploy source
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo '### Deploy source'
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            if [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
              echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Production's artifacts are only built, and only required, once
      # production deploys from here.
      - name: Choose the tiers to deploy
        id: tiers
        env:
          PRODUCTION: ${{ vars.BACKSTAGE_DEPLOYS_PRODUCTION }}
        run: |
          if [ "$PRODUCTION" = true ]; then
            echo 'tiers=["staging","production"]' >> "$GITHUB_OUTPUT"
            echo 'csv=staging,production' >> "$GITHUB_OUTPUT"
          else
            echo 'tiers=["staging"]' >> "$GITHUB_OUTPUT"
            echo 'csv=staging' >> "$GITHUB_OUTPUT"
          fi
      # Compared with the commit each tier last deployed, not the previous
      # commit, and failing open: see the header of deploy-needed.mjs.
      - name: Anything to deploy?
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          TIERS: ${{ steps.tiers.outputs.csv }}
        run: |
          set -euo pipefail
          node .github/scripts/deploy-needed.mjs --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --tiers "$TIERS" 2> needed.log | tee -a "$GITHUB_OUTPUT"
          cat needed.log
          { echo; echo '### Tiers'; echo; sed 's/^/- /' needed.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Find the merge queue run that built this commit
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          TIERS: ${{ steps.tiers.outputs.csv }}
        run: |
          run=$(node .github/scripts/merge-group-run.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tiers "$TIERS")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Artifacts'
            echo
            if [ -n "$run" ]; then
              echo "Built by the merge queue: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
            else
              echo 'No merge queue run has artifacts for this commit; they are built in this run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only when the merge queue did not build this commit.
  build:
    needs: resolve
    if: >-
      needs.resolve.outputs.merge_group_run == ''
      && (needs.resolve.outputs.staging == 'true' || needs.resolve.outputs.production == 'true')
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      tiers: ${{ needs.resolve.outputs.tiers }}

  staging-preflight:
    needs: resolve
    if: >-
      github.event_name == 'push'
      && !inputs.prune_orphans
      && needs.resolve.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      paused: ${{ steps.probe.outputs.paused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Classify the staging Supabase project
        id: probe
        env:
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
        run: backstage deploy preflight --no-env --yes

  # The database goes through the shared deploy-database.yaml (Q15): hand-written
  # migrations, then the declarative diff, each hash-checked, with the
  # destructive check and the Supabase configuration push. Staging has no
  # reviewers, so nothing waits here. A destructive plan is refused unless the
  # pull request that produced the commit approved it (allow-destructive).
  #
  # `--include-seed` runs the seed files staging has not recorded yet; they are
  # insert-only, so a rerun or an edited file changes nothing there.
  staging-database:
    needs: [resolve, staging-preflight]
    if: needs.staging-preflight.outputs.paused != 'true'
    uses: ./.github/workflows/deploy-database.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: staging
      include_seed: true
      apply_config: ${{ needs.resolve.outputs.staging_config != 'false' }}

  # The seed SQL never touches Storage. This uploads only the headshots the
  # bucket lacks, so a photo an officer replaced is never overwritten.
  staging-avatars:
    needs: staging-database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Upload new seeded headshots
        env:
          API_URL: ${{ vars.API_URL }}
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: backstage deploy avatars --no-env --yes

  # The two Workers are independent deploy targets, each through the shared
  # deploy-worker.yaml: upload a version, smoke test it (the platform's also
  # runs the OAuth authorize and consent checks), switch traffic, smoke test
  # what is live. One failing is worth knowing about on its own; it is not a
  # reason to leave the other on the previous version.
  #
  # `!cancelled()` and explicit results: `build` is skipped whenever the merge
  # queue already built, and a skipped need would otherwise skip these too.
  staging-platform:
    needs: [resolve, build, staging-database, staging-avatars]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.resolve.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.staging-database.result == 'success'
      && needs.staging-avatars.result == 'success'
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: staging
      tier: staging
      worker_dir: apps/platform
      worker_name: staging-platform
      skip: ${{ needs.resolve.outputs.staging_platform == 'false' }}
      authorize: true
      artifact_name: staging-${{ github.sha }}
      artifact_run_id: ${{ needs.resolve.outputs.merge_group_run }}
      build_cli: true
      sentry_project: platform
      sourcemaps_dir: apps/platform/dist
      # The ONLY step that reads the secrets and vars contexts as a whole.
      # After it, the checkout looks like a devops laptop and every later step
      # is the command a person would run by hand. Writes .env.staging at the
      # repo root, where both apps read it. --no-env: this step CREATES the
      # file tier resolution would insist on reading.
      prepare_command: backstage deploy write-env --no-env --yes
      upload_command: backstage deploy platform --tier staging --upload --yes
      full_deploy_command: backstage deploy platform --tier staging --yes
      mode: ${{ vars.WORKER_DEPLOY_MODE || 'versions' }}
      # The docs search index lives in the platform's database, written from
      # the docs the artifact carries (docs/dist); after the switch, so it does
      # not describe pages the previous Worker cannot render yet. Then
      # meetings/workshops reconcile against @devdogsuga/events the moment this
      # deploy's code is live, and the read-only Sentry check confirms the
      # release arrived.
      after_switch_command: |
        set -a; . ".env.$TIER"; set +a
        pnpm --filter @devdogsuga/docs run populate:search
        backstage deploy reconcile --tier staging --no-env --yes
        SENTRY_PROJECT=platform GITHUB_SHA="$RELEASE" backstage deploy smoke --tier staging --yes --app platform --no-env

  # The catalog API and the registrar scrape (apps/catalog), also through the
  # shared deploy-worker.yaml. It has no build artifact (the deploy bundles
  # src/worker.ts), no Sentry project of its own (it reports to the platform's,
  # tagged worker:catalog) and no web pages, so its smoke test is the API's:
  # apps/catalog/smoke.json for the pinned version and what is live, then
  # `test:smoke` for the headers. Both pass against an empty database, so the
  # first deploy of an environment is green before its first scrape.
  #
  # The first deploy of a Worker that does not exist yet has no serving version
  # to preview beside: set the repository variable CATALOG_DEPLOY_MODE to
  # `full` for that one run, then delete it. (WORKER_DEPLOY_MODE applies to
  # all Workers; this one is separate so the platform keeps its previews.)
  staging-catalog:
    needs: [resolve, build, staging-database, staging-avatars]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.resolve.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.staging-database.result == 'success'
      && needs.staging-avatars.result == 'success'
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: staging
      tier: staging
      worker_dir: apps/catalog
      worker_name: staging-catalog
      skip: ${{ needs.resolve.outputs.staging_catalog == 'false' }}
      smoke_path: apps/catalog
      workers_json: apps/catalog/smoke.json
      build_cli: true
      prepare_command: backstage deploy write-env --no-env --yes
      upload_command: backstage deploy catalog --tier staging --upload --yes
      full_deploy_command: backstage deploy catalog --tier staging --yes
      mode: ${{ vars.CATALOG_DEPLOY_MODE || vars.WORKER_DEPLOY_MODE || 'versions' }}
      after_switch_command: |
        CATALOG_URL=https://api-staging.devdogsuga.org/catalog/v1 pnpm --filter catalog run test:smoke

  # --- production -------------------------------------------------------------
  # In order, each a shared building block:
  #
  #   production-database   plan (read-only credential, in `preflight`), then an
  #                         approval of `production`, then migrations, the
  #                         schema diff and the config push. A plan that drops
  #                         or rewrites data is refused unless its pull request
  #                         approved it (allow-destructive).
  #
  # With ONE_APPROVAL=true that job is replaced by three, and the Workers
  # after it no longer ask:
  #
  #   production-plan       the same plans, read-only, before any approval.
  #   production-approval   THE approval (production-approval environment), with
  #                         one summary of everything this deploy will do.
  #   production-database-apply  migrations, schema, config, in `production`
  #                         (no reviewers in this mode).
  #   production-catalog    the registrar scrape and the catalog API. BEFORE
  #                         the platform: it no longer runs the scrape or the
  #                         Bulletin sync, so the catalog's Workflows have to
  #                         exist first or the daily data stops.
  #   production-platform   upload, preview smoke, switch, live smoke.
  #
  # DogDays (dogdays.dev) deploys from its own repository; its Worker is not
  # deployed from here any more.
  #
  # Each approved job refuses an approver who wrote or queued the change (Q61)
  # and refuses a candidate that is no longer the head of `main`.
  production-database:
    needs: [supersede, resolve, build, staging-platform, staging-catalog]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && !inputs.prune_orphans
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL != 'true'
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.production == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && ((needs.staging-platform.result == 'success' && needs.staging-catalog.result == 'success') || needs.resolve.outputs.staging == 'false')
    uses: ./.github/workflows/deploy-database.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: production
      plan_environment: preflight
      require_read_only_planner: true
      include_seed: true
      apply_config: ${{ needs.resolve.outputs.production_config != 'false' }}
      self_approval_gate: true
      require_latest: true

  # --- the one-approval flow (ONE_APPROVAL=true) ---
  production-plan:
    needs: [supersede, resolve, build, staging-platform, staging-catalog]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && !inputs.prune_orphans
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL == 'true'
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.production == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && ((needs.staging-platform.result == 'success' && needs.staging-catalog.result == 'success') || needs.resolve.outputs.staging == 'false')
    uses: ./.github/workflows/plan-database.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: production
      plan_environment: preflight
      include_seed: true

  production-approval:
    needs: [resolve, production-plan]
    if: >-
      !cancelled()
      && vars.ONE_APPROVAL == 'true'
      && needs.production-plan.result == 'success'
    uses: ./.github/workflows/approve-production.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      approval_environment: production-approval
      plan_environment_name: production
      notes: |
        - Supabase configuration push: ${{ needs.resolve.outputs.production_config == 'false' && 'skipped (config.toml and the seeds did not change)' || 'yes' }}
        - Catalog Worker (`production-catalog`): ${{ needs.resolve.outputs.production_catalog == 'false' && 'unchanged, skipped' || 'deploys: upload, preview smoke test, switch traffic, live smoke test' }}
        - Platform Worker (`production-platform`): ${{ needs.resolve.outputs.production_platform == 'false' && 'unchanged, skipped' || 'deploys: upload, preview smoke test, switch traffic, live smoke test, search index, reconcile' }}
        - Order: migrations, schema and configuration, then the catalog, then the platform.

  # Its jobs skip themselves when there is nothing to apply (no pending
  # migration, an empty schema diff and an unchanged config), and the call then
  # reports `skipped`. The Workers below accept that as well as `success`:
  # requiring `success` skipped both Workers on a deploy with no database work
  # while the run still went green (run 40441210925). The call's own `if` only
  # fails when the approval did, which the Workers check separately.
  production-database-apply:
    needs: [resolve, production-plan, production-approval]
    if: >-
      !cancelled()
      && vars.ONE_APPROVAL == 'true'
      && needs.production-approval.result == 'success'
    uses: ./.github/workflows/apply-database.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    with:
      environment: production
      approval_environment: production-approval
      pending: ${{ needs.production-plan.outputs.pending }}
      migrations_hash: ${{ needs.production-plan.outputs.migrations_hash }}
      schema_hash: ${{ needs.production-plan.outputs.schema_hash }}
      schema_empty: ${{ needs.production-plan.outputs.schema_empty }}
      include_seed: true
      apply_config: ${{ needs.resolve.outputs.production_config != 'false' }}

  # api.devdogsuga.org is Supabase's custom domain for the platform project
  # until the cutover (Q90), so the catalog's production route reaches nothing
  # until `api` is a proxied record in the zone. Set the repository variable
  # CATALOG_PRODUCTION_ROUTED to `true` then, and the smoke tests start gating
  # this deploy (until then the Worker deploys and switches without them). The
  # first production deploy needs CATALOG_DEPLOY_MODE=full, as on staging.
  production-catalog:
    needs:
      [
        resolve,
        build,
        production-database,
        production-approval,
        production-database-apply,
      ]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && needs.resolve.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && ((vars.ONE_APPROVAL != 'true' && needs.production-database.result == 'success')
          || (vars.ONE_APPROVAL == 'true' && needs.production-approval.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.production-database-apply.result)))
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: production
      tier: production
      worker_dir: apps/catalog
      worker_name: production-catalog
      skip: ${{ needs.resolve.outputs.production_catalog == 'false' }}
      approval_environment: ${{ vars.ONE_APPROVAL == 'true' && 'production-approval' || '' }}
      smoke_path: apps/catalog
      workers_json: apps/catalog/smoke.json
      smoke: ${{ vars.CATALOG_PRODUCTION_ROUTED == 'true' }}
      self_approval_gate: true
      require_latest: true
      build_cli: true
      prepare_command: backstage deploy write-env --no-env --yes
      upload_command: backstage deploy catalog --tier production --upload --yes
      full_deploy_command: backstage deploy catalog --tier production --yes
      mode: ${{ vars.CATALOG_DEPLOY_MODE || vars.WORKER_DEPLOY_MODE || 'versions' }}
      after_switch_command: |
        if [ "${{ vars.CATALOG_PRODUCTION_ROUTED }}" = true ]; then
          CATALOG_URL=https://api.devdogsuga.org/catalog/v1 pnpm --filter catalog run test:smoke
        fi

  production-platform:
    needs:
      [
        resolve,
        build,
        production-database,
        production-approval,
        production-database-apply,
        production-catalog,
      ]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && needs.resolve.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && ((vars.ONE_APPROVAL != 'true' && needs.production-database.result == 'success')
          || (vars.ONE_APPROVAL == 'true' && needs.production-approval.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.production-database-apply.result)))
      && needs.production-catalog.result == 'success'
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: production
      tier: production
      worker_dir: apps/platform
      worker_name: production-platform
      skip: ${{ needs.resolve.outputs.production_platform == 'false' }}
      approval_environment: ${{ vars.ONE_APPROVAL == 'true' && 'production-approval' || '' }}
      authorize: true
      self_approval_gate: true
      require_latest: true
      artifact_name: production-${{ github.sha }}
      artifact_run_id: ${{ needs.resolve.outputs.merge_group_run }}
      build_cli: true
      sentry_project: platform
      sourcemaps_dir: apps/platform/dist
      prepare_command: |
        backstage deploy write-env --no-env --yes
        (set -a; . ".env.$TIER"; set +a; backstage deploy avatars --no-env --yes)
      upload_command: backstage deploy platform --tier production --upload --yes
      full_deploy_command: backstage deploy platform --tier production --yes
      mode: ${{ vars.WORKER_DEPLOY_MODE || 'versions' }}
      after_switch_command: |
        set -a; . ".env.$TIER"; set +a
        pnpm --filter @devdogsuga/docs run populate:search
        backstage deploy reconcile --tier production --no-env --yes
        SENTRY_PROJECT=platform GITHUB_SHA="$RELEASE" backstage deploy smoke --tier production --yes --app platform --no-env
        # Deletes the Sentry Crons monitors the app no longer declares in
        # `cloudflare/scheduled.ts`. Sentry never removes a monitor itself.
        # After the smoke test, so it only runs once this deploy's cron
        # triggers are live. Production only: staging deploys `main`, which can
        # drop a monitor production still checks in to.
        backstage deploy prune-monitors --tier production --yes --app platform --no-env
        backstage env audit --target production --no-env --yes

  # `production` has no reviewers in the one-approval flow, so a manual prune
  # asks for the approval itself first.
  prune-approval:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.prune_orphans
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL == 'true'
    uses: ./.github/workflows/approve-production.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      approval_environment: production-approval
      notes: Deletes the production Worker secrets nothing declares any more (`backstage env audit --prune`).
      self_approval_gate: false
      require_latest: false

  prune-orphans:
    needs: prune-approval
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && inputs.prune_orphans
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && (vars.ONE_APPROVAL != 'true' || needs.prune-approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Prune orphaned Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: backstage env audit --target production --prune --yes --no-env
