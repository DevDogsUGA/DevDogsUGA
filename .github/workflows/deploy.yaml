name: Deploy

# The only workflow in this repository that holds credentials.
#
# `ci.yaml` is validation and deliberately has none: on `pull_request` GitHub
# runs the workflow definition FROM THE PULL REQUEST, so any secret in scope
# there is readable by whoever opened it. This file is the other side of that
# line — everything needing a real credential lives here, after the merge gate.
#
#   feature ──PR──▶ main ──────────────────────▶ deploy STAGING
#                    │
#                    └──promotion PR──▶ production ──▶ deploy PRODUCTION
#
# ⚠️ THERE IS NO `pull_request` TRIGGER HERE, AND THERE CANNOT BE ONE. This is
# structural rather than stylistic: environment secrets are reachable only when
# `github.ref` matches the environment's deployment-branch policy, and a pull
# request's ref is `refs/pull/N/merge`, which matches no policy pattern. Adding
# a PR trigger would not "run the deploy on PRs"; it would run a deploy with
# every credential silently empty, against whatever the branch happened to say.
#
# Staging deploys from `main` rather than from a `staging` branch. A workflow
# pushing to a protected branch needs a GitHub App in the bypass list —
# complexity with no matching benefit when the branch would only ever mirror
# `main`.
#
# ⚠️ No TURBO_TOKEN / TURBO_TEAM here either. Remote caching is entirely off
# (`turbo.json` configures no `remoteCache`, verified 2026-08-11), and turning
# it on requires — in the same change — either `remoteCache.signature` or
# disjoint cache scopes for trusted and untrusted contexts. A PR that can WRITE
# a cache a deploy later READS is a path from an unreviewed branch into a
# production artifact. `ci.yaml` carries the same warning.

on:
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      prune_orphans:
        description: >-
          Delete Worker secrets nothing declares any more. Production only,
          and it SKIPS the deploy — see the prune job for why.
        type: boolean
        default: false

# No `cancel-in-progress`, unlike ci.yaml. A cancelled validation run wastes a
# minute; a cancelled deploy leaves a Worker half-published or a migration
# half-applied, and the queue is one deploy deep in practice anyway.
concurrency:
  group: deploy-${{ github.ref }}

# Least privilege for GITHUB_TOKEN. Nothing here writes to the repository —
# the deploy targets are Cloudflare and Supabase, reached with their own
# credentials.
permissions:
  contents: read

env:
  # The one place the branch becomes an environment name. Everything downstream
  # reads DEPLOY_ENV, which `@devdogsuga/env` ALLOWLISTS to three names — so a
  # typo here fails loudly at the first `with-env` rather than loading a file
  # nobody meant.
  DEPLOY_ENV: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

# ⚠️ SKIP_ENV_VALIDATION IS DELIBERATELY ABSENT, and this is the difference
# that matters between this file and ci.yaml. CI sets it because it has no
# .env; here the whole env schema is exactly what should be enforced, and a
# newly required variable with no value must fail the build rather than reach
# production undefined (security plan §A.6.3).
#
# ── the two devtools entry points, and why every step names one ──────────────
#
# Every step below runs a `devtools deploy <step>` command. They used to be
# loose files in `scripts/` that reached into devtools' own sources through a
# relative path; they are commands now, with the same help, refusals and named
# errors as the rest of the CLI. Which entry point a step uses is NOT a style
# choice:
#
#   run cli          `with-env tsx src/cli.ts` — loads .env.$DEPLOY_ENV first.
#   run cli:no-env   the same entry point with that wrapper removed.
#
# ⚠️ `deploy write-env` is the step that CREATES .env.$DEPLOY_ENV, so routing
# it through `with-env` is a bootstrap cycle: it would die on
# MissingEnvFileError for the file it was about to write.
#
# `deploy orphans`, `deploy preflight`, `deploy require-token`,
# `deploy airtable-plan` and `deploy airtable-apply` are `cli:no-env` for a
# different reason — they run in jobs that hold one narrow credential and
# compose no env file at all, so the wrapped entry point would exit reporting a
# missing FILE rather than the missing TOKEN, the paused project or the missing
# Airtable credential, which is the one thing those jobs exist to say. Note
# that the Airtable pair take their two variables from the step's own `env:`
# block precisely so that stays true: nothing composes a file for them. This is
# NOT about the two nested cases: inside `with-env -c '…'` the wrapper would be
# value-neutral anyway, because dotenvx leaves an already-set value alone. It
# is about the BARE runs in the orphan-audit and prune jobs, and the same entry
# point is used in both places so there is one answer rather than two.
#
# Everything downstream of write-env uses `run cli`, because reading the values
# it composed is the entire point of those steps.
#
# ⚠️ NOTHING here may run a deploy command through a wrapper that writes to
# stdout. `deploy secrets-file` emits `::add-mask::<token>`, which GitHub
# recognises only on a line of its own, and `deploy mint-token` (which
# `--mint` runs) emits a JWT its caller takes whole. pnpm's own `$ <command>`
# banner goes to stderr — measured — which is why `pnpm --filter … run` is
# safe here; `intro()` does not, which is why cli.ts suppresses it for this
# group.

jobs:
  # ── staging ─────────────────────────────────────────────────────────────────

  # Is staging's Supabase project awake? See the command for the whole argument;
  # in short, staging is free-tier, free-tier projects pause after a week
  # without activity, and staging deploys roughly weekly — so paused is the
  # EXPECTED state and must not surface as a Postgres connection error that
  # reads like a broken migration.
  #
  # A separate job rather than a first step, so the skip shows up in the run
  # graph as a skipped deploy instead of a green one that quietly did nothing.
  staging-preflight:
    if: github.ref_name == 'main' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # For `vars` only. PROJECT_REF and PUBLISHABLE_KEY are both public (§A.4)
    # and no secret is read here — one unauthenticated request classifies the
    # project before any credential is in scope.
    environment: staging
    outputs:
      paused: ${{ steps.probe.outputs.paused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # This job used to skip `pnpm install` entirely — the probe was a
      # standalone script importing nothing outside node: builtins, and that
      # kept the job to a few seconds. It is a devtools command now, so the
      # install is back. The trade is deliberate: a cached install is a few
      # tens of seconds against a probe that shares the CLI's error reporting
      # and is covered by the same suite as everything else here, rather than
      # being the one step in the pipeline that nothing tests.
      - run: pnpm install --frozen-lockfile
      # cli:no-env — there is no env file in this job, and there must not be:
      # it holds `vars` only, so that one unauthenticated request classifies
      # the project before any credential is in scope.
      - name: Classify the Supabase project
        id: probe
        env:
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy preflight

  staging-deploy:
    needs: staging-preflight
    if: needs.staging-preflight.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    strategy:
      # The three Workers are independent deploy targets. One failing is worth
      # knowing about on its own; it is not a reason to leave the other two on
      # the previous version.
      fail-fast: false
      matrix:
        include:
          - app: platform
            mint: ""
          - app: schedule-builder
            mint: ""
          # The sandbox proxy's credential is SIGNED at deploy time rather than
          # stored, so it cannot arrive through the env file. `--mint` is a
          # BARE FLAG now: it runs `devtools deploy mint-token`, a sibling of
          # the command that calls it, and derives WHICH variable the token
          # fills from the app's own manifest. It used to name a script to run
          # and take the stdout of, which made a workflow edit enough to point
          # the composer at any executable on the runner.
          - app: sandbox
            mint: --mint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ONLY step in this file that reads the `secrets` and `vars` contexts.
      # After it, the checkout looks like a devops laptop and every later step
      # is the command a person would run by hand.
      - name: Compose .env.staging from the environment
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        # ⚠️ cli:no-env, and this is the one place in the file where that is
        # not interchangeable with `run cli`. This step CREATES the file
        # `with-env` would insist on reading, so routing it through the wrapper
        # would fail on MissingEnvFileError for its own output.
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy write-env
      - name: Build the workspace packages this app depends on
        run: pnpm turbo run build --filter='${{ matrix.app }}^...'
      # `next build` through OpenNext, with the env schema ENFORCED. sandbox is
      # a plain Worker and wrangler bundles it during the deploy itself.
      - name: Build ${{ matrix.app }}
        if: matrix.app != 'sandbox'
        run: pnpm --filter ${{ matrix.app }} run "cf:build:$DEPLOY_ENV"
      # Written to a mkdtemp 0700 directory and removed below whatever happens.
      - name: Compose the Worker secrets file
        id: secrets
        # `run cli` — with-env — because the whole job of this step is to read
        # the values write-env composed. Its stdout carries `::add-mask::` and
        # nothing else; see the note at the top of this file.
        run: >-
          pnpm --filter @devdogsuga/devtools run cli deploy secrets-file
          --app ${{ matrix.app }} ${{ matrix.mint }}
      # One step for all three Workers now that apps/sandbox/package.json
      # carries the same `cf:deploy:*` scripts as the Next apps — the
      # ${DEPLOY_SECRETS_FILE:+--secrets-file …} hook plus, for sandbox,
      # `--var PLATFORM_REST_URL:$REST_URL`. That --var is a deploy-time value
      # rather than a committed wrangler.jsonc entry: one committed value
      # cannot be right for three environments, and the placeholder that
      # shipped in all three is the measurement of how often it got edited by
      # hand.
      - name: Deploy ${{ matrix.app }}
        env:
          DEPLOY_SECRETS_FILE: ${{ steps.secrets.outputs.file }}
        run: pnpm --filter ${{ matrix.app }} run "cf:deploy:$DEPLOY_ENV"
      # The `finally` half of the mkdtemp. A hosted runner is discarded whole,
      # so this is for the self-hosted case and for a job that fails between
      # composing the file and using it.
      - name: Remove the Worker secrets file
        if: always()
        env:
          DIR: ${{ steps.secrets.outputs.dir }}
        run: if [ -n "$DIR" ]; then rm -rf "$DIR"; fi

  # ── plan against production, on merge to main (§3.5 stage 1) ────────────────

  # Runs BEFORE the promotion PR is opened, so "what would this do to
  # production" is answered on the commit that will be promoted rather than
  # discovered during the promotion.
  #
  # `preflight` is a read-only credential tier by construction: a Postgres role
  # granted SELECT on `supabase_migrations.schema_migrations` and nothing else.
  # A general read-only role would NOT be acceptable — it would put every row of
  # production data behind a `main`-tier trust boundary.
  #
  # This is reachable from `main` only because environment policies match
  # `github.ref`; the same job could never be run from a pull request.
  main-plan:
    if: github.ref_name == 'main' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ⚠️ `set -o pipefail` is load-bearing, not boilerplate. `supabase db
      # push` exits 1 on a connection failure, and a pipeline without it reports
      # the exit code of `tee` — so a dry run that never connected reads as a
      # clean plan.
      - name: What would these migrations do to production?
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          { echo '### Migration plan — production (from `main`)'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          pnpm exec supabase db push --dry-run --db-url "$DB_URL" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # The other half of §3.5 stage 1. It used to be a comment here saying it
      # could not be done: the Airtable commands read AIRTABLE_PAT, which is
      # declared `secrecy: "never-store"`, so no CI job could legitimately hold
      # a credential they would use.
      #
      # What closed it is a THIRD token rather than a wider one.
      # AIRTABLE_PLAN_PAT carries `schema.bases:read` on the one base — a
      # records read and a schema write both answered 403 when it was probed —
      # and the client now picks its token by CAPABILITY, preferring the
      # narrowest that can do the job. `deploy airtable-plan` asks for `read`,
      # which never consults AIRTABLE_APPLY_PAT at all.
      #
      # ⚠️ NO `if: secrets.AIRTABLE_PLAN_PAT != ''`, DELIBERATELY. That guard
      # is how the old Airtable job passed for months without ever running. The
      # command REFUSES by name when the credential is missing, and a red job
      # saying which variable is unset is the entire value of the step.
      #
      # AIRTABLE_BASE_ID is an ENVIRONMENT variable on `preflight`, written by
      # `env push --target preflight` like everything else this job reads. It
      # is public (§A.4), so it lands in the variable store rather than the
      # secret one — hence `vars.` rather than `secrets.` — and it is declared
      # `narrowed`, which is what routes it to a target no app boots from.
      #
      # It was a hand-set REPOSITORY variable until 2026-08-17, because nothing
      # routed it here. A repository variable is visible to every environment,
      # so the workaround for a routing gap had a wider reach than the routing
      # it stood in for. If one is still set, delete it: an environment copy
      # shadows it, so a stale repository value is invisible until the day
      # somebody removes the environment one.
      - name: What would this commit do to the Airtable base?
        env:
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_PLAN_PAT: ${{ secrets.AIRTABLE_PLAN_PAT }}
        # cli:no-env, like the other steps in jobs that hold one narrow
        # credential and compose no env file: `with-env` would report a missing
        # FILE rather than the missing TOKEN, which is the one thing this step
        # exists to say.
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy airtable-plan

  # ── production ──────────────────────────────────────────────────────────────

  # Stage 2 of the dry runs. Stage 1 above goes stale the moment another
  # promotion lands first; this one is computed seconds before the mutation.
  production-plan:
    if: github.ref_name == 'production' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      config-changed: ${{ steps.config.outputs.changed }}
      airtable-changed: ${{ steps.airtable.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both ends of the push, so the config diff below can be taken.
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What will these migrations do to production?
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          { echo '### Migration plan — production'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          pnpm exec supabase db push --dry-run --db-url "$DB_URL" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # `supabase config` has exactly one subcommand — `push`. No pull, no diff,
      # no --dry-run. So config.toml is the highest blast radius (site_url and
      # every OAuth provider) with the least visibility, and its COMMITTED DIFF
      # is the only plan there is. Printing it here is that plan; the reviewer
      # gate on the apply job is what makes printing it worth anything.
      #
      # `github.event.before` is absent on a dispatch and all-zeros on a new
      # branch. Either way this falls through to "changed", which asks for an
      # approval that may be unnecessary — the safe direction.
      - name: Did config.toml change?
        id: config
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; assuming config.toml changed." >&2
            exit 0
          fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- supabase/config.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo; echo '### config.toml diff — this IS the plan'; echo; echo '```diff'; } >> "$GITHUB_STEP_SUMMARY"
            git diff "$BEFORE" "$GITHUB_SHA" -- supabase/config.toml >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      # The same read-only plan the `main` job ran, recomputed seconds before
      # the apply — stage 1 goes stale the moment another promotion lands
      # first, which is the whole reason §3.5 has two stages.
      #
      # It also GATES the apply, the way the config diff above gates its own
      # approval: `changed` is true only when the base is missing a table or a
      # field the registry declares. Asking for a reviewer on every promotion
      # is how approvals stop being read.
      #
      # AIRTABLE_PLAN_PAT is plan-tier, so `env push` routes it to `production`
      # as well as to `preflight`; this job needs no write credential and must
      # not be given one — that is what the job below is for.
      - name: What will this promotion do to the Airtable base?
        id: airtable
        env:
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_PLAN_PAT: ${{ secrets.AIRTABLE_PLAN_PAT }}
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy airtable-plan

  # Applying the migrations. In `production` rather than `production-apply`,
  # and that placement follows the tiering rather than working around it:
  # apply-tier is for credentials that can reshape production AND HAVE NO DRY
  # RUN. Migrations have one — it ran seconds ago, in the job this needs — so
  # the Postgres credential is deploy-tier and lives here. The gate in front of
  # it is the promotion PR (maintainers only, two approvals).
  #
  # `--db-url` rather than `--linked`: linking needs a Supabase access token,
  # which is the account-wide credential this tier deliberately does not hold.
  production-migrate:
    needs: production-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          pnpm exec supabase db push --db-url "$DB_URL" --yes

  # The one mutation with no dry run gets its own approval step, which is what
  # `production-apply` is: the same Bitwarden project as `production`, split
  # across two GitHub environments, with required reviewers on this half. That
  # split IS the gate — see packages/devtools/src/gh/environments.ts.
  #
  # Skipped when config.toml did not change, so the approval is asked for when
  # there is something to approve rather than on every promotion.
  production-config:
    needs: [production-plan, production-migrate]
    if: needs.production-plan.outputs.config-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-apply
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--source supabase` composes exactly what config.toml reads — the four
      # OAuth provider pairs, the two site URLs and their callbacks — and
      # demands every secret among them rather than only the schema-required
      # ones. They are all `.optional()`, because no APP boots on them; only
      # this file does. So without that stricter rule a provider could be
      # reconfigured with its secret quietly unset, which is the single highest
      # blast radius change in the repository (`site_url` and every sign-in
      # route) arriving through the step with no dry run.
      #
      # Those secrets are deploy-tier, and `production-apply` receives them
      # because it receives everything `production` does plus the apply-tier
      # pair. That is not the gate leaking: the gate is what the UNREVIEWED
      # `production` may not hold, and this environment is the reviewed half of
      # the same Bitwarden project. Until 2026-08-17 the routing withheld them
      # here and this step could not have run at all.
      #
      # SUPABASE_DB_PASSWORD arrives the same way, from the same push.
      - name: Compose the config-push environment
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        # cli:no-env for the same bootstrap reason as the other write-env
        # steps: this composes .env.production, which nothing has written yet.
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy write-env
          --source supabase
      # SUPABASE_ACCESS_TOKEN is passed here rather than composed: it belongs to
      # the operator manifest, not to supabase's, and `with-env` leaves a value
      # already in the environment alone.
      - name: Push config.toml
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec with-env -c 'supabase config push --project-ref $PROJECT_REF'

  # The Airtable schema apply — the other mutation that needs a reviewer, and
  # the only write-capable Airtable credential in the pipeline.
  #
  # ⚠️ ITS OWN JOB, NOT A STEP IN production-config, and the reason is that
  # job's `if:`. `production-config` is skipped unless config.toml changed, so
  # an Airtable step living there would never run on a promotion that changed
  # `registry.ts` and nothing else — which is exactly the promotion the schema
  # apply exists for. A step that silently does not run is the failure mode
  # this whole section was written to remove.
  #
  # Gated on the plan instead, the same way the config job is gated on its own
  # diff: an approval requested on every promotion is an approval nobody reads.
  # `scaffoldBase` is idempotent, so a re-run after a partial failure creates
  # only what is still missing.
  #
  # Needs production-migrate for ordering rather than for data: both mutate,
  # and doing them in a fixed order makes a half-finished promotion legible.
  production-airtable:
    needs: [production-plan, production-migrate]
    if: needs.production-plan.outputs.airtable-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-apply
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # AIRTABLE_APPLY_PAT is the only Airtable token this environment holds
      # that `production` does NOT — apply-tier routes here and nowhere else,
      # which is what makes the reviewer gate mean something. The command asks
      # for `write` and never falls back to AIRTABLE_PLAN_PAT: that token
      # cannot write, so a fallback would turn a named refusal into a 403 with
      # the base half changed.
      #
      # ⚠️ Both are secrets ON this environment now that `production-apply`
      # receives a superset. The `env:` block below is what keeps this step to
      # one token — the plan PAT is never in the process environment, so
      # capability selection has nothing to get wrong here.
      #
      # AIRTABLE_BASE_ID is an environment variable, written by
      # `env push --target production` like every other value this job reads.
      - name: Apply the Airtable schema
        env:
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
          AIRTABLE_APPLY_PAT: ${{ secrets.AIRTABLE_APPLY_PAT }}
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy airtable-apply

  production-deploy:
    needs:
      - production-plan
      - production-migrate
      - production-config
      - production-airtable
    # A dependency that was SKIPPED normally skips its dependents, and both the
    # config and Airtable jobs are skipped on most promotions — config.toml
    # rarely changes and the base rarely gains a field. So the condition is
    # spelled out: migrations must have succeeded, and neither gated job may
    # have FAILED (skipped is fine). `!cancelled()` rather than `always()`, so
    # cancelling the run still cancels the deploy.
    if: >-
      !cancelled()
      && needs.production-migrate.result == 'success'
      && needs.production-config.result != 'failure'
      && needs.production-airtable.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: platform
            mint: ""
          - app: schedule-builder
            mint: ""
          # See the staging matrix for why --mint takes no argument.
          - app: sandbox
            mint: --mint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compose .env.production from the environment
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        # ⚠️ cli:no-env, and this is the one place in the file where that is
        # not interchangeable with `run cli`. This step CREATES the file
        # `with-env` would insist on reading, so routing it through the wrapper
        # would fail on MissingEnvFileError for its own output.
        run: >-
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy write-env
      - name: Build the workspace packages this app depends on
        run: pnpm turbo run build --filter='${{ matrix.app }}^...'
      - name: Build ${{ matrix.app }}
        if: matrix.app != 'sandbox'
        run: pnpm --filter ${{ matrix.app }} run "cf:build:$DEPLOY_ENV"
      - name: Compose the Worker secrets file
        id: secrets
        # `run cli` — with-env — because the whole job of this step is to read
        # the values write-env composed. Its stdout carries `::add-mask::` and
        # nothing else; see the note at the top of this file.
        run: >-
          pnpm --filter @devdogsuga/devtools run cli deploy secrets-file
          --app ${{ matrix.app }} ${{ matrix.mint }}
      # One step for all three Workers; see the staging job for the
      # PLATFORM_REST_URL note.
      - name: Deploy ${{ matrix.app }}
        env:
          DEPLOY_SECRETS_FILE: ${{ steps.secrets.outputs.file }}
        run: pnpm --filter ${{ matrix.app }} run "cf:deploy:$DEPLOY_ENV"
      - name: Remove the Worker secrets file
        if: always()
        env:
          DIR: ${{ steps.secrets.outputs.dir }}
        run: if [ -n "$DIR" ]; then rm -rf "$DIR"; fi

  # ── orphaned Worker secrets (§3.6) ──────────────────────────────────────────

  # `--secrets-file` preserves what it omits, so a renamed or dropped variable
  # leaves its secret on the Worker indefinitely and nothing else in the system
  # can see it. Reported on every production deploy; NEVER fatal, because a
  # stale name is not a defect in the change that was just shipped.
  production-orphans:
    needs: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No env file, hence cli:no-env on both lines: this reads secret NAMES
      # from Cloudflare and needs exactly one credential to do it. The existing
      # guard is invoked rather than reimplemented, so a missing token says who
      # to ask instead of dropping into wrangler's browser OAuth.
      - name: Report orphaned Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy require-token
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy orphans

  # Deleting them is a separate, deliberate, human-triggered run — never
  # chained to a deploy. Each deletion PUBLISHES A NEW VERSION of the code
  # already deployed (there is no way to change a Worker secret without
  # publishing), so auto-pruning would turn every deploy carrying an orphan
  # into two publishes, the second of which went through neither the promotion
  # PR nor this environment's reviewers.
  #
  # It skips the deploy entirely: a dispatch that ticked this box is a
  # maintenance run, not a release.
  #
  # `CLOUDFLARE_API_TOKEN` is deploy-tier, and it reaches this environment
  # because `production-apply` receives everything `production` does plus the
  # apply-tier pair. The token being deploy-tier is right — pruning has a dry run,
  # `deploy orphans` without `--prune`, and it is the job above — so what puts a
  # human in front of the deletion is this environment's reviewers rather than
  # the tier. Until 2026-08-17 the routing withheld it and this job could not
  # have run.
  prune-orphans:
    if: github.event_name == 'workflow_dispatch' && inputs.prune_orphans && github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-apply
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prune orphaned Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy require-token
          pnpm --filter @devdogsuga/devtools run cli:no-env deploy orphans --prune
