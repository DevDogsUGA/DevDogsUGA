name: Prepare and publish

# Called by CI after the validation job succeeds on a push to main. Keeping
# preparation and publication in the push-initiated run preserves GitHub's
# self-review attribution: the person who pushed the candidate cannot approve
# its publishing environment deployment.
#
# Two channels share this file, because npm Trusted Publishing is configured
# against it:
#   * stable (the default): `latest`, after a manual `publishing` approval;
#   * next: prereleases on the `next` dist-tag, through the reviewer-less
#     `publishing-next` environment (scripts/publish-next.mjs).
on:
  workflow_call:
    inputs:
      channel:
        description: "stable (default) or next"
        type: string
        default: stable

concurrency:
  group: publish-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.channel != 'next'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Build publishable packages
        env:
          DEVTOOLS_SENTRY_DSN: ${{ vars.DEVTOOLS_SENTRY_DSN }}
          WORKSHOPS_VSCODE_SENTRY_DSN: ${{ vars.WORKSHOPS_VSCODE_SENTRY_DSN }}
        run: pnpm -r --filter './packages/**' --if-present run build
      - name: Re-run CLI contract tests against the release build
        env:
          DEVTOOLS_TELEMETRY: "0"
        run: |
          pnpm --filter @devdogsuga/devtools run test:contract
          pnpm --filter @devdogsuga/backstage run test:contract
      - name: Prepare immutable npm artifacts and release plan
        env:
          # Read-only: whether an unchanged package's GitHub release exists.
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-changed-packages.mjs --prepare "$RUNNER_TEMP/release"
      - name: Prepare immutable VS Code artifact and release plan
        env:
          WORKSHOPS_VSCODE_SENTRY_DSN: ${{ vars.WORKSHOPS_VSCODE_SENTRY_DSN }}
        run: node scripts/publish-workshops-vscode.mjs --prepare "$RUNNER_TEMP/release"
      # Whether `publish` has anything to do: a package or the extension to
      # publish, or an unchanged package whose GitHub release is missing. When
      # not, `publish` is skipped, and nobody is asked to approve a no-op.
      #
      # The extension only counts once the Marketplace is set up: its publish
      # step skips without `VSCE_PAT`, a `publishing` secret this job cannot
      # see, so the repository variable WORKSHOPS_MARKETPLACE=true says so.
      # Without it, a never-released extension asked for approval on every
      # push and then published nothing.
      - name: Anything to publish?
        id: plan
        env:
          MARKETPLACE: ${{ vars.WORKSHOPS_MARKETPLACE }}
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = process.argv[1];
            const npm = JSON.parse(fs.readFileSync(`${dir}/npm-plan.json`, "utf8"));
            const ext = fs.existsSync(`${dir}/extension-plan.json`)
              ? JSON.parse(fs.readFileSync(`${dir}/extension-plan.json`, "utf8"))
              : { action: "unchanged" };
            const needed =
              npm.packages.some((p) => p.action !== "unchanged" || p.releaseMissing) ||
              (process.env.MARKETPLACE === "true" && ext.action !== "unchanged");
            console.log(needed ? "Something to publish." : "Nothing to publish; skipping the publish job.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          ' "$RUNNER_TEMP/release"
      - name: Record candidate hashes
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: inputs.channel != 'next' && needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    # Room for the script to wait out npm's CDN after each publish layer (up to
    # 15 minutes per layer, usually seconds; packages in a layer publish and
    # wait concurrently, and layers run in order; see publishLayers).
    timeout-minutes: 45
    environment: publishing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Download approved release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify candidate hashes
        run: cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1
      - name: Publish exact npm artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/publish-changed-packages.mjs
          --publish-plan "$RUNNER_TEMP/release/npm-plan.json"
      - name: Publish exact VS Code artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          node scripts/publish-workshops-vscode.mjs
          --publish-plan "$RUNNER_TEMP/release/extension-plan.json"
      - name: Show npm OIDC diagnostics
        if: failure()
        run: grep -iE 'oidc|trusted|provenance' ~/.npm/_logs/*-debug-0.log || true

  # ── the next channel ───────────────────────────────────────────────────────
  # Same shape as above, with no approval: the candidate is built and planned
  # in `prepare-next` (no credentials), then `publish-next` verifies the plan
  # against this checkout and the artifact hashes and publishes with
  # `npm publish --tag next`. Called only for a push to `main`.
  prepare-next:
    if: inputs.channel == 'next'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Build publishable packages
        env:
          DEVTOOLS_SENTRY_DSN: ${{ vars.DEVTOOLS_SENTRY_DSN }}
        run: pnpm -r --filter './packages/**' --if-present run build
      # The same gate the stable channel has: the CLIs on `next` are what
      # products and `pnpm devtools` (`pnpm dlx @devdogsuga/devtools@next`) run, so a broken tarball
      # must fail here, before anything is uploaded for publishing.
      - name: Re-run CLI contract tests against the release build
        env:
          DEVTOOLS_TELEMETRY: "0"
        run: |
          pnpm --filter @devdogsuga/devtools run test:contract
          pnpm --filter @devdogsuga/backstage run test:contract
      - name: Prepare the prerelease candidate
        env:
          NEXT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/publish-next.mjs --prepare "$RUNNER_TEMP/release-next"
      - name: Anything to publish?
        id: plan
        run: |
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(`${process.argv[1]}/next-plan.json`, "utf8"));
            const needed = plan.packages.some((p) => p.action === "publish");
            console.log(needed ? "Something to publish." : "Nothing changed; skipping the publish job.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          ' "$RUNNER_TEMP/release-next"
      - name: Record candidate hashes
        run: |
          cd "$RUNNER_TEMP/release-next"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-next-${{ github.sha }}
          path: ${{ runner.temp }}/release-next
          if-no-files-found: error
          retention-days: 30

  publish-next:
    needs: prepare-next
    if: inputs.channel == 'next' && needs.prepare-next.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No reviewers, and deployable from `main` only (plus the Dart SDK's tags,
    # which this job never runs for): see packages/backstage github settings.
    environment: publishing-next
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Download the release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-next-${{ github.sha }}
          path: ${{ runner.temp }}/release-next
      - name: Verify candidate hashes
        run: cd "$RUNNER_TEMP/release-next" && sha256sum --check SHA256SUMS
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1
      - name: Publish the prereleases
        run: node scripts/publish-next.mjs --publish-plan "$RUNNER_TEMP/release-next/next-plan.json"
      - name: Show npm OIDC diagnostics
        if: failure()
        run: grep -iE 'oidc|trusted|provenance' ~/.npm/_logs/*-debug-0.log || true
