name: Destructive gate

# Who may apply the `allow-destructive` label (Q10). Runs on `pull_request_target`
# so its token can edit the pull request, which also means it must NEVER check
# out or run the pull request's code: the one script it runs comes from the
# base branch, and it reads only the PR number the event gives it.
#
# What it does:
#   * the label is on the pull request and its applier is not a `devops` member:
#     the check fails and the label is removed, so a stray label cannot sit
#     there looking approved;
#   * database inputs change: the bot comment's fingerprint becomes stale
#     and the label is removed. Identical SQL survives a rebase.
#
# The required `destructive-gate` check is database-pr.yaml's, which runs the
# same test read-only. This job is `destructive-label`, and not required: one
# check name per job, so a ruleset requiring `destructive-gate` never sees two
# results for it on one commit.
#
# Shared like database-pr.yaml: a product repository calls it from a
# `pull_request_target` workflow of its own, pinned by commit SHA, with
# `shared_ref` set to that SHA. A called workflow runs in the caller's context,
# so it still never touches the pull request's code.
on:
  pull_request_target:
    # `edited` covers a changed base branch: the check is re-reported for it.
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
  workflow_call:
    inputs:
      shared_ref:
        description: >-
          A commit of DevDogsUGA/DevDogsUGA to take the script from. Leave empty
          when DevDogsUGA runs this.
        required: false
        type: string
        default: ""

# Serialize comment updates and label removals; do not cancel an approval
# halfway through recording it when a push arrives.
concurrency:
  group: destructive-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destructive-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The base branch's copy of the script. No `ref:`: this event checks out
      # the base, not the pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.shared_ref != ''
        with:
          repository: DevDogsUGA/DevDogsUGA
          ref: ${{ inputs.shared_ref }}
          path: .shared
          sparse-checkout: .github/scripts
      - name: Who applied the allow-destructive label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action == 'labeled' && github.event.label.name != 'allow-destructive' && 'other-label' || github.event.action }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SCRIPTS: ${{ github.workspace }}/${{ inputs.shared_ref != '' && '.shared/.github/scripts' || '.github/scripts' }}
        # `shell: bash` is `bash -eo pipefail`: without it the pipe to tee
        # would hide a failing check.
        shell: bash
        run: node "$SCRIPTS/destructive-label.mjs" gate --repo "$GITHUB_REPOSITORY" --pr "$PR" --remove-rejected --record --action "$ACTION" --head "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
