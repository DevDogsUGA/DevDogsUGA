name: Deploy app

# The per-tier deploy, called once by `deploy.yaml`'s `staging-deploy` and once
# by its `production-deploy`. Those two jobs were byte-identical apart from the
# tier they name and the gating in front of them, so the recipe lives here once
# and each caller is a thin `uses:` + `with: { tier }` + `secrets: inherit`.
#
# ── why the shape is exactly this ────────────────────────────────────────────
#
# `environment:` sits on the JOB below, driven by the `tier` input — a caller
# job that `uses:` a reusable workflow may not carry `environment:` itself, and
# putting it here is what injects each tier's environment secrets and variables
# and enforces its protection rules. `github.ref` inside a reusable workflow is
# the CALLER's ref, so deployment-branch policies still match on the branch that
# triggered the run.
#
# `secrets: inherit` on the callers is load-bearing: environment secrets arrive
# through the `environment:` declaration, but the ORG/REPO secrets that
# `toJSON(secrets)` also serialises into the compose step only survive the hop
# when inherited. Both together are what keep `write-env`'s blob complete.
#
# `DEPLOY_ENV` is set from the input HERE rather than inherited: a caller's
# workflow-level `env:` does not propagate into a called workflow.

on:
  workflow_call:
    inputs:
      tier:
        description: The deploy tier and environment name (staging or production).
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.tier }}
    env:
      DEPLOY_ENV: ${{ inputs.tier }}
      # Job-level, not read straight from `secrets` in a step `if:` — the
      # `secrets` context is not available there (only `env`, `github`,
      # `inputs`, `job`, `matrix`, `needs`, `runner`, `steps`, `strategy`,
      # `vars` are), so this is the one place the token is lifted out of
      # `secrets` for the gating steps below to test against `env` instead. Not
      # a wider exposure than passing it into a step's own `env:` would be —
      # every step in this job already inherits job-level `env`, and secrets
      # are masked in logs regardless of which step's `env:` names them.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    strategy:
      # The three Workers are independent deploy targets. One failing is worth
      # knowing about on its own; it is not a reason to leave the other two on
      # the previous version.
      fail-fast: false
      matrix:
        include:
          - app: platform
            mint: ""
          - app: schedule-builder
            mint: ""
          # The sandbox proxy's credential is SIGNED at deploy time rather than
          # stored, so it cannot arrive through the env file. `--mint` is a
          # BARE FLAG now: it runs `devtools deploy mint-token`, a sibling of
          # the command that calls it, and derives WHICH variable the token
          # fills from the app's own manifest. It used to name a script to run
          # and take the stdout of, which made a workflow edit enough to point
          # the composer at any executable on the runner.
          - app: sandbox
            mint: --mint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # The ONLY step in this file that reads the `secrets` and `vars` contexts.
      # After it, the checkout looks like a devops laptop and every later step
      # is the command a person would run by hand.
      - name: Compose .env.${{ inputs.tier }} from the environment
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        # ⚠️ run ci — this step CREATES the file `with-env` would insist on
        # reading, so routing it through the wrapper would fail on
        # MissingEnvFileError for its own output.
        run: >-
          pnpm --filter @devdogsuga/devtools run ci deploy write-env
      - name: Build the workspace packages this app depends on
        run: pnpm turbo run build --filter='${{ matrix.app }}^...'
      # `next build` through OpenNext, with the env schema ENFORCED. sandbox is
      # a plain Worker and wrangler bundles it during the deploy itself.
      - name: Build ${{ matrix.app }}
        if: matrix.app != 'sandbox'
        env:
          # SENTRY_RELEASE: read by `devtools`' `ci.ts` at deploy time (a step
          # below), not by this build — kept here too so a build run outside
          # that deploy step still carries it, harmlessly, since nothing in
          # THIS step's output reads it.
          SENTRY_RELEASE: ${{ github.sha }}
          # NEXT_PUBLIC_SENTRY_RELEASE: inlined into the CLIENT bundle by
          # `next build` (the `NEXT_PUBLIC_` prefix is what makes that
          # happen) so `instrumentation-client.ts`'s browser-side
          # `Sentry.init` tags its events with the same release the server
          # side and the `getsentry/action-release` step below associate
          # source maps with. Not part of `~/env`'s schema — see
          # `apps/platform/cloudflare/worker.ts`'s `WorkerEnv` doc for why a
          # per-deploy git SHA doesn't fit `EnvScope`.
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm --filter ${{ matrix.app }} run "cf:build:$DEPLOY_ENV"
      # sandbox has no separate build step above — wrangler bundles it at
      # deploy time (see `matrix.mint`'s neighbouring comment) — so a source
      # map for it does not exist until something bundles it. `--dry-run`
      # bundles without publishing or touching any Cloudflare credential, into
      # a scratch directory the release step below reads. The REAL deploy a
      # few steps down re-bundles from scratch; that duplication is the cost
      # of getting a source map out of a Worker with no standalone build step,
      # and it is cheaper than teaching the real deploy command `--no-bundle`
      # against a dry-run's output (see the cheatsheet's plain-Worker source
      # maps section for why that pairing is fragile).
      - name: Bundle sandbox for source maps (dry run)
        if: matrix.app == 'sandbox' && env.SENTRY_AUTH_TOKEN != ''
        run: >-
          pnpm --filter sandbox exec wrangler deploy -e $DEPLOY_ENV
          --dry-run --outdir dist-sentry
      # ⚠️ GATING, PER AN EXPLICIT DECISION: SENTRY_AUTH_TOKEN absent means the
      # Sentry org is not onboarded yet, and that must be a visible skip, not
      # a silent one — hence the warning step below rather than folding the
      # condition into one step with no trace it ran. SENTRY_AUTH_TOKEN
      # PRESENT and this step failing must fail the job — no
      # `continue-on-error` — because a configured token that cannot create a
      # release or upload source maps is a real break, not a best-effort nice-
      # to-have.
      - name: Sentry release skipped (SENTRY_AUTH_TOKEN not configured)
        if: env.SENTRY_AUTH_TOKEN == ''
        run: echo "::warning::Sentry release for ${{ matrix.app }} skipped — SENTRY_AUTH_TOKEN is not configured (org not onboarded yet)."
      - name: Create Sentry release and upload source maps (${{ matrix.app }})
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ matrix.app }}
        with:
          environment: ${{ env.DEPLOY_ENV }}
          release: ${{ github.sha }}
          # "release" over the deprecated "version" input, and skipping commit
          # association entirely -- these jobs check out with the default
          # shallow depth, and this step's whole job here is the release
          # record and its source maps, not a changelog.
          set_commits: skip
          sourcemaps: >-
            ${{ matrix.app == 'sandbox' && 'apps/sandbox/dist-sentry' || format('apps/{0}/.open-next', matrix.app) }}
      # Written to a mkdtemp 0700 directory and removed below whatever happens.
      - name: Compose the Worker secrets file
        id: secrets
        # `run ci:env` — the quiet CI entry point that loads the env file — because
        # the whole job of this step is to read the values write-env composed. Its
        # stdout carries `::add-mask::` and nothing else; see the note above.
        run: >-
          pnpm --filter @devdogsuga/devtools run ci:env deploy secrets-file
          --app ${{ matrix.app }} ${{ matrix.mint }}
      # One step for all three Workers via devtools-ci deploy — the
      # ${DEPLOY_SECRETS_FILE:+--secrets-file …} hook plus, for sandbox,
      # `--var PLATFORM_REST_URL:$REST_URL`. That --var is a deploy-time value
      # rather than a committed wrangler.jsonc entry: one committed value
      # cannot be right for three environments, and the placeholder that
      # shipped in all three is the measurement of how often it got edited by
      # hand.
      - name: Deploy ${{ matrix.app }}
        env:
          DEPLOY_SECRETS_FILE: ${{ steps.secrets.outputs.file }}
          # Read by `ci.ts`'s `runAppDeploy`, which forwards it to
          # `wrangler deploy` as `--var SENTRY_RELEASE:…` for all three apps
          # (same mechanism as `--var PLATFORM_REST_URL:…` above) — the ONLY
          # way this reaches each Worker's runtime `env`, since none of them
          # read it from `~/env`'s schema or a committed wrangler.jsonc var.
          # `cloudflare/worker.ts` (platform, schedule-builder),
          # `ScrapeWorkflow.ts`, and `apps/sandbox/src/index.ts` all pass this
          # through to `buildSentryOptions({ release })` so captured events
          # associate with the release this job's `action-release` step
          # created and uploaded source maps against.
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm --filter @devdogsuga/devtools run ci:env deploy ${{ matrix.app }} --tier $DEPLOY_ENV
      # The `finally` half of the mkdtemp. A hosted runner is discarded whole,
      # so this is for the self-hosted case and for a job that fails between
      # composing the file and using it.
      - name: Remove the Worker secrets file
        if: always()
        env:
          DIR: ${{ steps.secrets.outputs.dir }}
        run: if [ -n "$DIR" ]; then rm -rf "$DIR"; fi
