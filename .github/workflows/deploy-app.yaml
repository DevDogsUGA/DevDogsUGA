name: Deploy app

# The per-tier deploy, called once by `deploy.yaml`'s `staging-deploy` and once
# by its `production-deploy`. Those two jobs were byte-identical apart from the
# tier they name and the gating in front of them, so the recipe lives here once
# and each caller is a thin `uses:` + `with: { tier }` + `secrets: inherit`.
#
# ── why the shape is exactly this ────────────────────────────────────────────
#
# `environment:` sits on the JOB below, driven by the `tier` input — a caller
# job that `uses:` a reusable workflow may not carry `environment:` itself, and
# putting it here is what injects each tier's environment secrets and variables
# and enforces its protection rules. `github.ref` inside a reusable workflow is
# the CALLER's ref, so deployment-branch policies still match on the branch that
# triggered the run.
#
# `secrets: inherit` on the callers is load-bearing: environment secrets arrive
# through the `environment:` declaration, but the ORG/REPO secrets that
# `toJSON(secrets)` also serialises into the compose step only survive the hop
# when inherited. Both together are what keep `write-env`'s blob complete.
#
# `DEPLOY_ENV` is set from the input HERE rather than inherited: a caller's
# workflow-level `env:` does not propagate into a called workflow.

on:
  workflow_call:
    inputs:
      tier:
        description: The deploy tier and environment name (staging or production).
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.tier }}
    env:
      DEPLOY_ENV: ${{ inputs.tier }}
      # Job-level, not read straight from `secrets` in a step `if:` — the
      # `secrets` context is not available there (only `env`, `github`,
      # `inputs`, `job`, `matrix`, `needs`, `runner`, `steps`, `strategy`,
      # `vars` are), so this is the one place the token is lifted out of
      # `secrets` for the gating steps below to test against `env` instead. Not
      # a wider exposure than passing it into a step's own `env:` would be —
      # every step in this job already inherits job-level `env`, and secrets
      # are masked in logs regardless of which step's `env:` names them.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    strategy:
      # The two Workers are independent deploy targets. One failing is worth
      # knowing about on its own; it is not a reason to leave the other on the
      # previous version.
      fail-fast: false
      matrix:
        include:
          - app: platform
          - app: schedule-builder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # The ONLY step in this file that reads the `secrets` and `vars` contexts.
      # After it, the checkout looks like a devops laptop and every later step
      # is the command a person would run by hand.
      - name: Compose .env.${{ inputs.tier }} from the environment
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        # ⚠️ --no-env — this step CREATES the file tier resolution would
        # insist on reading, so routing it through tier resolution would fail
        # on a missing env file for its own output. See deploy.yaml's header
        # for what `--no-env` means.
        run: pnpm backstage deploy write-env --no-env --yes
      # The Sentry release action runs in its own container and never sees the
      # file above, so the org slug (a committed value in devtools' manifest,
      # not a GitHub variable) is lifted into the job environment for it and
      # the smoke test. `write-env` single-quotes every value, and GITHUB_ENV
      # keeps quotes literally, so both quote styles are stripped here; with
      # them left in, the smoke test asked Sentry for org `'devdogsuga'` and
      # got a 404.
      - name: Export SENTRY_ORG from .env.${{ inputs.tier }}
        run: grep -m1 '^SENTRY_ORG=' ".env.$DEPLOY_ENV" | tr -d "\"'" >> "$GITHUB_ENV"
      # `vinext build`, with the env schema ENFORCED.
      - name: Build ${{ matrix.app }}
        env:
          # SENTRY_RELEASE: read by `backstage deploy` at deploy time (a step
          # below), not by this build — kept here too so a build run outside
          # that deploy step still carries it, harmlessly, since nothing in
          # THIS step's output reads it.
          SENTRY_RELEASE: ${{ github.sha }}
          # NEXT_PUBLIC_SENTRY_RELEASE: inlined into the CLIENT bundle by
          # `next build` (the `NEXT_PUBLIC_` prefix is what makes that
          # happen) so `instrumentation-client.ts`'s browser-side
          # `Sentry.init` tags its events with the same release the server
          # side and the `getsentry/action-release` step below associate
          # source maps with. Not part of `~/env`'s schema — see
          # `apps/platform/cloudflare/worker.ts`'s `WorkerEnv` doc for why a
          # per-deploy git SHA doesn't fit `EnvScope`.
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          # The tier, set on the process so it wins over `.env.<tier>`. The
          # GitHub environments store NEXT_PUBLIC_DEPLOY_ENV as the formula
          # `$DEPLOY_ENV`, and write-env writes it into the file unexpanded, so
          # the build saw the literal string. The per-tier build scripts used to set
          # both of these, which is why nothing caught it until they went.
          NEXT_PUBLIC_DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          CLOUDFLARE_ENV: ${{ env.DEPLOY_ENV }}
        run: pnpm --filter ${{ matrix.app }} run build
      # ⚠️ GATING, PER AN EXPLICIT DECISION: SENTRY_AUTH_TOKEN absent means the
      # Sentry org is not onboarded yet, and that must be a visible skip, not
      # a silent one — hence the warning step below rather than folding the
      # condition into one step with no trace it ran. SENTRY_AUTH_TOKEN
      # PRESENT and this step failing must fail the job — no
      # `continue-on-error` — because a configured token that cannot create a
      # release or upload source maps is a real break, not a best-effort nice-
      # to-have.
      - name: Sentry release skipped (SENTRY_AUTH_TOKEN not configured)
        if: env.SENTRY_AUTH_TOKEN == ''
        run: echo "::warning::Sentry release for ${{ matrix.app }} skipped — SENTRY_AUTH_TOKEN is not configured (org not onboarded yet)."
      - name: Create Sentry release and upload source maps (${{ matrix.app }})
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ matrix.app }}
        with:
          environment: ${{ env.DEPLOY_ENV }}
          release: ${{ github.sha }}
          # "release" over the deprecated "version" input, and skipping commit
          # association entirely -- these jobs check out with the default
          # shallow depth, and this step's whole job here is the release
          # record and its source maps, not a changelog.
          set_commits: skip
          # Both Next.js apps build through vinext now (see each app's
          # `build`, tier from DEPLOY_ENV), which writes maps under BOTH
          # `dist/client` (browser bundle) and `dist/server` (the Worker
          # bundle, `dist/server/index.js.map`), so their path is the `dist`
          # parent rather than either half alone.
          sourcemaps: apps/${{ matrix.app }}/dist
      # `backstage deploy <app>` is the whole Worker deploy: it refuses without
      # CLOUDFLARE_API_TOKEN, writes the Worker's secrets file from the app's
      # manifest into a mkdtemp 0700 directory, runs `wrangler deploy` with it
      # and removes it again whatever happened. It loads the env file write-env
      # composed (no `--no-env`), which is where those values come from.
      - name: Deploy ${{ matrix.app }}
        env:
          # Read by `backstage deploy`, which forwards it to `wrangler deploy`
          # as `--var SENTRY_RELEASE:…` — the ONLY way this reaches each
          # Worker's runtime `env`, since neither reads it from `~/env`'s
          # schema or a committed wrangler.jsonc var.
          # `cloudflare/worker.ts` and `ScrapeWorkflow.ts` both pass this
          # through to `buildSentryOptions({ release })` so captured events
          # associate with the release this job's `action-release` step
          # created and uploaded source maps against.
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm backstage deploy ${{ matrix.app }} --tier $DEPLOY_ENV --yes
      # The docs search index lives in the platform's database, written from the
      # compiled docs the build step above produced, and the Worker serves it as
      # soon as it is live. After the deploy rather than before: the index
      # should not describe pages the previous Worker cannot render yet.
      # `populate:search` runs through `with-env`, so it reads the tier's env
      # file for the database URL like any local run would.
      - name: Index the docs for search
        if: matrix.app == 'platform'
        run: pnpm -F @devdogsuga/docs populate:search
      # Reconciles `meetings`/`workshops` against @devdogsuga/events, the
      # moment this deploy's own code is live rather than waiting on the
      # next fifteen-minute cron slot (see
      # apps/platform/src/app/(api)/cron/config-reconcile/route.ts's own doc
      # comment). Deliberately placed HERE, after THIS matrix entry's own
      # deploy, and not at migrate time in deploy.yaml: the config
      # `@devdogsuga/events` bundles into the Worker is baked in at build
      # time, so calling this route at migrate time would reconcile against
      # whatever config the PREVIOUS release shipped with, not this one's.
      #
      # `devtools jobs run` was NOT used here even though it already wraps
      # an authenticated GET at this route: it only checks the HTTP status,
      # and this route answers 200 even when the reconcile itself failed
      # (`{ success: false, reason: … }`) — a real failure would pass
      # silently. `backstage deploy reconcile` reads the body.
      #
      # --no-env: the one credential is CRON_SECRET, in this step's env:. The
      # host comes from workers.json's `smoke` field.
      #
      # `matrix.app == 'platform'` only: the config being reconciled
      # (meetings, workshops) is platform's alone, and schedule-builder
      # serves no such route.
      - name: Reconcile meetings/workshops from @devdogsuga/events
        if: matrix.app == 'platform'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: pnpm backstage deploy reconcile --tier $DEPLOY_ENV --no-env --yes
      # Read-only smoke test against the Worker version just deployed: every
      # listed public route answers 200, the one known protected route
      # redirects an anonymous request, and — only when SENTRY_AUTH_TOKEN is
      # configured — this deploy's Sentry release is visible. Does NOT re-check
      # config-reconcile: the step immediately above is now the one and
      # only place that runs, so this would otherwise trigger it twice.
      # Fails the job (and so this deploy) on any non-skipped failure. No
      # state-changing request of any kind. --no-env: the credentials it uses
      # (SENTRY_AUTH_TOKEN, SENTRY_ORG) are already in the job environment, and
      # the routes and hosts come from workers.json's `smoke` field.
      - name: Smoke test ${{ matrix.app }} (${{ env.DEPLOY_ENV }})
        env:
          SENTRY_PROJECT: ${{ matrix.app }}
        run: >-
          pnpm backstage deploy smoke --tier $DEPLOY_ENV --yes
          --app ${{ matrix.app }} --no-env
