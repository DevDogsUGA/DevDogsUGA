name: CI

# Validation only. No deploys, and — deliberately — no secrets of any kind.
#
# That is the invariant this file exists to hold: on `pull_request`, GitHub runs
# the workflow definition FROM THE PULL REQUEST, not from the protected branch.
# Any credential in scope here is therefore readable by whoever opened the PR,
# and once contributors have push access their PRs are same-repo branches, which
# (unlike forks) are handed the repository's secrets. The only safe amount is
# none.
#
# Anything that genuinely needs a credential belongs after the merge gate, in
# the deploy workflow, or in the Cloudflare cron.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. The repository default is already `read`,
# but that is an org-level setting somebody can change without touching this
# file, so it is pinned here too.
permissions:
  contents: read

env:
  # The apps validate their whole env schema on import (@t3-oss/env), and CI has
  # no .env. Correct here; NEVER set on a real deploy build, where the schema is
  # exactly what should be enforced.
  SKIP_ENV_VALIDATION: "true"

# Actions are pinned to full commit SHAs rather than tags: a tag is mutable, and
# moving one is how a compromised action reaches every consumer at once. The
# trailing comment is what lets Dependabot keep them current.
jobs:
  # Lint + typecheck + test + build for the JS/TS packages affected by the change.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so `turbo --affected` can compute the merge base.
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Flutter isn't installed here — the study-group-finder app is validated
      # in the `flutter` job below. Turbo runs the four tasks in parallel.
      - name: Lint + typecheck + test + build (affected)
        run: >-
          pnpm turbo run lint typecheck test build
          --affected --filter='!study-group-finder'
      # Reads the committed snapshot and touches no network, so it needs no
      # credential -- which is why it can live here at all. It answers "does
      # registry.ts still agree with the base as last observed", not "is the
      # live base still correct"; the latter needs a token and belongs in the
      # deployed worker's cron.
      #
      # Unconditional rather than --affected: the registry is edited by hand
      # after `pull-ids`, and a hand-edited id is exactly the mistake with no
      # other detection. It costs no network and about a second.
      - name: Registry agrees with the schema snapshot
        run: pnpm airtable:snapshot:check

  # Everything that needs a real Postgres: 139 tests CI has never run.
  #
  # Credential-free like the rest of this file, and not by exception — the local
  # stack's keys ARE the well-known constants Supabase publishes in its own
  # documentation. Nothing here can reach a real project.
  #
  # Unconditional rather than --affected, deliberately. Migrations and RLS are
  # the highest-consequence things in this repository, the whole job is a few
  # minutes, and a security check that skips itself on a heuristic is exactly the
  # failure mode described at the bottom of this file: the Airtable job passed
  # for months by never running.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's volume is always empty, so this applies every migration to
      # a fresh database and fails if any of them does not apply -- which is the
      # "migrations apply cleanly from scratch" check, with no separate reset
      # needed. Also writes .env.generated, which the suites below read.
      #
      # config.toml enables four OAuth providers with `env()` credentials that
      # CI does not have. Verified: unset resolves to a WARN and exit 0, not an
      # error.
      - name: Start the local Supabase stack
        run: pnpm --filter @devdogsuga/supabase run start-local-stack
      # Catches a migration that changed the schema without the committed types
      # being regenerated -- which typechecks fine everywhere until something
      # reads a column the types still claim exists.
      - name: Generated Database types match the migrations
        run: |
          pnpm --filter @devdogsuga/supabase run generate-types:local
          git diff --exit-code -- packages/supabase/src/database.types.ts
      # 54 tests. All app schemas share one PostgREST endpoint and one anon key,
      # so RLS -- not the schema boundary -- is what isolates one app's data from
      # another's. This is the only thing that checks it.
      - name: Row-Level Security
        run: pnpm --filter @devdogsuga/supabase run test:rls
      # 85 tests, including the privilege-surface guards in
      # resolveCredential.db-test.ts. Those assert the shape of the GRANTS, which
      # nothing else can see: a function reachable by every role in the cluster
      # typechecks perfectly.
      - name: Query validity + privilege surface
        run: pnpm --filter platform run test:db

  # Repo-wide formatting check — fast, no build needed.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check

  # Flutter app — only when it (or a shared dep) is affected.
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Is study-group-finder affected?
        id: affected
        run: |
          if pnpm turbo run build --affected --filter=study-group-finder --dry-run=json | grep -q '"study-group-finder"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.affected.outputs.run == 'true'
        with:
          channel: stable
          cache: true
      - name: Analyze + test
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/study-group-finder
        run: |
          flutter pub get
          flutter analyze
          flutter test

# Removed from this workflow, and not yet replaced:
#
#   * Airtable base verification. It needed AIRTABLE_PAT, which cannot live in a
#     PR-triggered workflow. It moves to a Cloudflare cron in the deployed
#     worker, which already holds the credential and — verifying with the same
#     token and scopes as the code that writes — catches a scope loss that a
#     separate CI token would not. Note the job never actually ran: the secret
#     was never set, so its `env.AIRTABLE_PAT != ''` guard skipped it every
#     time. Nothing regresses here; the gap is now recorded rather than silent.
#
#   * Turbo remote cache (TURBO_TOKEN / TURBO_TEAM). A token here is readable by
#     any PR author, and a PR that can WRITE the cache a deploy later READS is a
#     path from an unreviewed branch into a production artifact. If remote
#     caching returns, it needs signature verification or disjoint scopes for
#     trusted and untrusted contexts. These secrets were never set either.
#
#   * The `author_association` gates. Every contributor will be a COLLABORATOR,
#     so the condition passed by construction — protection in appearance only.
#     With no secrets in this file there is nothing left for it to protect.
#
# Both of the gaps recorded here have since been closed, credential-free:
#
#   * The local Supabase stack, as the `database` job above. A fresh runner
#     volume makes `supabase start` itself the from-scratch migration check, so
#     no separate `db reset` is needed.
#   * The Airtable registry, diffed against a committed schema snapshot in
#     `validate`. Note this is NOT the live-base verification that was removed:
#     it answers "does registry.ts still agree with the base as last observed",
#     which needs no token. "Is the live base still correct" needs one, and
#     still belongs in the deployed worker's cron.
#
# Note the `database` job runs under the workflow-wide SKIP_ENV_VALIDATION, so
# it does not prove the env schema -- .env.generated carries the local stack's
# values and nothing else. Validating the full server schema is the deploy
# build's job, where it is enforced rather than skipped.
