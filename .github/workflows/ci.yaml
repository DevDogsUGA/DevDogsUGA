name: CI

# PR validation only — no deploys. Runs on PRs opened by organization members
# (fork PRs from non-members are skipped; `pull_request` never exposes secrets
# to fork code).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "true"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Lint / typecheck / build only the packages affected by the PR.
  validate:
    if: contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `turbo --affected` can compute the merge base.
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Flutter isn't installed here — the study-group-finder app is validated
      # in the `flutter` job below.
      - name: Typecheck + build affected
        run: pnpm turbo run typecheck build --affected --filter='!@devdogsuga/study-group-finder'
      # TODO: add `lint` once the eslint-plugin-react / eslint 10 incompatibility
      # is resolved (downgrade eslint to ^9.39.x).

  # Flutter app — only when it (or a shared dep) is affected.
  flutter:
    if: contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Is study-group-finder affected?
        id: affected
        run: |
          if pnpm turbo run build --affected --filter=@devdogsuga/study-group-finder --dry-run=json | grep -q '"@devdogsuga/study-group-finder"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.affected.outputs.run == 'true'
        with:
          channel: stable
      - name: Analyze + test
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/study-group-finder
        run: |
          flutter pub get
          flutter analyze
          flutter test
