name: CI

# PR validation (and cache-warming pushes to main) — no deploys. Jobs run for
# PRs opened by organization members (fork PRs from non-members are skipped;
# `pull_request` never exposes secrets to fork code) and for pushes to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "true"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Lint + typecheck + test + build for the JS/TS packages affected by the change.
  validate:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `turbo --affected` can compute the merge base.
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Flutter isn't installed here — the study-group-finder app is validated
      # in the `flutter` job below. Turbo runs the four tasks in parallel and
      # shares the remote cache, so lint + test add little over typecheck+build.
      - name: Lint + typecheck + test + build (affected)
        run: >-
          pnpm turbo run lint typecheck test build
          --affected --filter='!study-group-finder'

  # Repo-wide formatting check — fast, no build needed.
  format:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check

  # Playwright E2E for the Next apps, only when one is affected. Runs against the
  # local Supabase stack (never remote — test accounts are backed by real
  # auth.users). Heavier than the other jobs; it Docker-boots Supabase.
  e2e:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Is a Next app affected?
        id: affected
        run: |
          if pnpm turbo run test:e2e --affected \
              --filter='platform' --filter='schedule-builder' \
              --dry-run=json | grep -qE '"(platform|schedule-builder)"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # `with-env`-wrapped scripts load a root .env; provide one from a secret so
      # the local Supabase stack and `dev:local` web server can boot in CI.
      - name: Write CI env file
        if: steps.affected.outputs.run == 'true'
        run: printf '%s' "${{ secrets.CI_DOTENV }}" > .env
      - name: Cache Playwright browsers
        if: steps.affected.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright (chromium)
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter platform exec playwright install --with-deps chromium
      - name: Start local Supabase stack
        if: steps.affected.outputs.run == 'true'
        run: pnpm sb start-local-stack
      - name: Run E2E (affected)
        if: steps.affected.outputs.run == 'true'
        run: >-
          pnpm turbo run test:e2e --affected
          --filter='platform' --filter='schedule-builder'
      - name: Upload Playwright report
        if: failure() && steps.affected.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*/playwright-report
          retention-days: 7
      - name: Stop local Supabase stack
        if: always() && steps.affected.outputs.run == 'true'
        run: pnpm sb stop-local-stack || true

  # The live Airtable base against the registry.
  #
  # Here rather than in `validate` because it needs the real base: the unit
  # tests drive a stub client, so they prove the checks fire and prove nothing
  # about the base anybody's data is in. A registry ID that has drifted is not
  # an error at write time — Airtable accepts the write and it lands nowhere —
  # so this job is the only thing standing between a renamed-away field and a
  # sync that reports success forever.
  #
  # Skipped when the secrets are absent, so a fork can still run CI.
  airtable:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env:` is not in scope for its
    # `if:`, so the secret-present guard has to be readable from up here.
    env:
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Is the Airtable package affected?
        id: affected
        run: |
          if pnpm turbo run build --affected --filter=@devdogsuga/airtable --dry-run=json | grep -q '"@devdogsuga/airtable"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the Airtable package
        if: steps.affected.outputs.run == 'true' && env.AIRTABLE_PAT != ''
        run: pnpm turbo run build --filter=@devdogsuga/airtable
      - name: Verify the base matches the registry
        if: steps.affected.outputs.run == 'true' && env.AIRTABLE_PAT != ''
        # `tsx` directly rather than the `airtable:verify` script, which wraps
        # itself in `with-env`: there is no root .env in CI, and the credentials
        # are already in the environment from the job's secrets.
        #
        # `--no-duplicates` skips reading every record. Duplicate match keys are
        # a property of the DATA, which changes without any commit, so failing a
        # build on them would mean a red CI that no PR caused and no PR can fix.
        run: pnpm exec tsx scripts/airtable/verify.ts --no-duplicates

  # Flutter app — only when it (or a shared dep) is affected.
  flutter:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Is study-group-finder affected?
        id: affected
        run: |
          if pnpm turbo run build --affected --filter=study-group-finder --dry-run=json | grep -q '"study-group-finder"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.affected.outputs.run == 'true'
        with:
          channel: stable
          cache: true
      - name: Analyze + test
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/study-group-finder
        run: |
          flutter pub get
          flutter analyze
          flutter test
