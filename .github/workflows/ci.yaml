name: CI

# Pull requests run validation only. A push to `main` invokes the reusable
# deploy workflow after every validation job succeeds.
#
# That is the invariant this file exists to hold: on `pull_request`, GitHub runs
# the workflow definition FROM THE PULL REQUEST, not from the protected branch.
# Any credential in scope here is therefore readable by whoever opened the PR,
# and once contributors have push access their PRs are same-repo branches, which
# (unlike forks) are handed the repository's secrets. The only safe amount is
# none.
#
# Anything that genuinely needs a credential belongs after the merge gate, in
# the deploy workflow, or in the Cloudflare cron.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PR updates supersede their older validation runs. Main pushes cannot share
  # a group: once validation hands a commit to the protected production gate,
  # a later push must not cancel a deployment that is already running.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN. The repository default is already `read`,
# but that is an org-level setting somebody can change without touching this
# file, so it is pinned here too.
permissions:
  contents: read

env:
  # The apps validate their whole env schema on import (@t3-oss/env), and CI has
  # no .env. Correct here; NEVER set on a real deploy build, where the schema is
  # exactly what should be enforced.
  SKIP_ENV_VALIDATION: "true"

# Actions are pinned to full commit SHAs rather than tags: a tag is mutable, and
# moving one is how a compromised action reaches every consumer at once. The
# trailing comment is what lets Dependabot keep them current.
jobs:
  # Lint + typecheck + test + build for the JS/TS packages affected by the change.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the base-ref diff below (affected-package
          # detection, done with a git-diff-backed pnpm `--filter
          # '...[<ref>]'` selector) has both ends of the comparison to work
          # with, whether that is a PR's base branch or the previous commit
          # on a push.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      # pnpm's `[<since>]` filter needs the ref named explicitly (turbo used to
      # auto-detect it); the composite action owns how it is computed.
      - name: Determine base ref for affected-package detection
        id: base
        uses: ./.github/actions/base-ref
      - name: Select affected packages
        id: since
        run: |
          REF="${{ steps.base.outputs.ref }}"
          # These are turbo's globalDependencies equivalents, but pnpm
          # attributes root-level files to the workspace root package, which
          # the filters below exclude -- a root-only change would otherwise
          # select nothing. Force the full package set when one changed.
          if git diff --quiet "$REF" HEAD -- tsconfig.base.json package.json pnpm-workspace.yaml pnpm-lock.yaml .npmrc; then
            echo "since=--filter=...[$REF]" >> "$GITHUB_OUTPUT"
          else
            echo "since=" >> "$GITHUB_OUTPUT"
          fi
      # The structural checks are `devtools check`, through the root script
      # (`pnpm dlx @devdogsuga/devtools`, always the latest publish). They read
      # the checkout and nothing else, so they need no env and no credential.
      #
      # `supabase/migrations/` is one flat directory; a new file timestamped
      # before the newest one already on the base branch would apply out of
      # the order its author tested it in the next time someone runs
      # migrations from scratch. Credential-free — pure git, no database — so
      # it runs here rather than in the `database` job, and needs the base
      # ref this job already resolved above rather than re-deriving it.
      - name: Migrations are added in timestamp order
        run: pnpm devtools check migrations --base "${{ steps.base.outputs.ref }}"
      # Every env variable is declared in a manifest, and the registry agrees.
      - name: Every env variable is declared
        run: pnpm devtools check env
      # workers.json against the wrangler.jsonc files and deploy-app.yaml's
      # matrix: a Worker added to one and forgotten in the other fails here
      # rather than deploying half of itself.
      - name: workers.json agrees with the Workers and the deploy matrix
        run: pnpm devtools check workers
      # One script vocabulary across the workspace (dev, build, test:<kind>,
      # types:<source>, ...), so `pnpm -F <app> <task>` means the same thing
      # everywhere.
      - name: Package scripts use the shared vocabulary
        run: pnpm devtools check scripts
      # Flutter isn't installed here — the study-group-finder app is validated
      # in the `flutter` job below.
      #
      # `build` is NOT in this list, and its absence is the point. A Next
      # production build reads the environment whether or not the schema is
      # validated -- next.config.ts resolves image patterns against
      # NEXT_PUBLIC_SUPABASE_URL, and `new URL(path, undefined)` throws before
      # any page renders. SKIP_ENV_VALIDATION moves that failure; it does not
      # remove the requirement. Building the apps needs a database, so it
      # happens in the `database` job, which has one.
      #
      # Each app's `pretypecheck`/`prelint`/`pretest` runs its own `codegen`
      # (the email templates, the docs module, and the GENERATED route types:
      # the `VinextRouteTypes` namespace and next-env.d.ts's
      # `vinext/types/augmentations` reference, which exist on every laptop
      # that has run `vinext dev` and on no fresh checkout). The workspace
      # packages are consumed from source, so there is nothing to build first.
      # `vinext typegen` (NOT `next typegen` -- the two write mutually
      # incompatible shapes to the same `.next/types/routes.d.ts`) needs
      # neither a build nor a database; next.config.ts falls back to a
      # placeholder URL under SKIP_ENV_VALIDATION.
      #
      # `pnpm -r` never selects the workspace root, so the root's own scripts
      # are never run here. `--if-present` skips the packages with no such
      # script (`@devdogsuga/supabase` has no `lint`, for one).
      - name: Lint + typecheck + test (affected)
        run: |
          status=0
          pnpm -r --if-present ${{ steps.since.outputs.since }} --filter '!study-group-finder' run lint || status=1
          pnpm -r --if-present ${{ steps.since.outputs.since }} --filter '!study-group-finder' run typecheck || status=1
          pnpm -r --if-present ${{ steps.since.outputs.since }} --filter '!study-group-finder' run test || status=1
          exit $status
      # REMOVED: "Events config passes its publishability checks"
      # (`pnpm -F @devdogsuga/events check:events`), the CLI that parses
      # data/meetings.json against the Zod schema and runs the validator
      # (lengths, the RSVP-host allowlist, cancellation pairing, id
      # uniqueness and shape).
      #
      # `@devdogsuga/events` is an installed npm dependency now, not a
      # workspace package, so `pnpm --filter` can no longer see it here to
      # run its `check` script. More to the point, the meetings/workshops
      # config-as-code — both the schema/validator source AND the authored
      # data/meetings.json this step was gating — moved to Backstage with the
      # package; DevDogsUGA no longer has anything to author or check here.
      # Backstage's own CI runs this same gate on every change to that
      # package. If a future `@devdogsuga/events` release ships a config
      # that fails its own validator, that is a bug in the published
      # package, not something a check in this repo can catch earlier.
      # .env.example is GENERATED from the env manifests; this regenerates it
      # in memory and byte-compares -- the same pattern the database job uses
      # for database.types.ts. Credential-free by construction: the generator
      # is registry-only (no Bitwarden token, no network, no Docker).
      #
      # `with-env` reports a missing `.env` and continues rather than
      # refusing to start, so this job -- which deliberately does not have
      # one -- calls the one front door like everything else.
      #
      # Unconditional rather than --affected: any manifest edit anywhere can
      # change the output, and it costs about a second.
      # `--no-env`: nothing here may read an env file, and the generator would
      # otherwise pick up whatever the machine has.
      - name: .env.example agrees with the env manifests
        run: pnpm devtools env example --check --no-env
      - name: Cloudflare binding types match the Worker configuration
        run: pnpm --filter platform types:cf:check && pnpm --filter schedule-builder types:cf:check
      # REMOVED: "Typecheck the deploy scripts" (`tsc -p scripts/tsconfig.json`).
      #
      # It existed because `scripts/` was not a workspace package, so the
      # lint/typecheck/test step could not see it — while the files in it
      # were the ones that composed production credentials and wrote Worker
      # secrets. All six are `backstage deploy` commands now, typechecked,
      # linted and tested in Backstage, and `scripts/` is gone with them; a
      # step pointed at an empty directory does not fail loudly, it fails as
      # TS18003 "no inputs were found", which reads like a broken config
      # rather than like a job with nothing to do.

  # Everything that needs a real Postgres: 189 tests CI has never run.
  #
  # Credential-free like the rest of this file, and not by exception — the local
  # stack's keys ARE the well-known constants Supabase publishes in its own
  # documentation. Nothing here can reach a real project.
  #
  # Unconditional rather than --affected, deliberately. Migrations and RLS are
  # the highest-consequence things in this repository, the whole job is a few
  # minutes, and a security check that skips itself on a heuristic is exactly
  # the failure mode this repository has already been bitten by: a job
  # guarded on `secrets.X != ''` that passed green for months without ever
  # running, because the secret it needed was never set.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # The runner's volume is always empty, so this applies every migration to
      # a fresh database and fails if any of them does not apply -- which is the
      # "migrations apply cleanly from scratch" check, with no separate reset
      # needed. The step after it writes .env.generated, which the suites below
      # read.
      #
      # ⚠️ The RLS suite and the builds run through `with-env`, which REFUSES a
      # missing .env by design. Seed it before the stack writes the local
      # connection overlay; the synthetic-environment step right after the
      # stack starts replaces this file and appends the generated values.
      - name: Seed the env file for wrapped checks
        run: cp .github/ci.env .env
      # config.toml enables four OAuth providers with `env()` credentials that
      # CI does not have. Verified: unset resolves to a WARN and exit 0, not an
      # error.
      #
      # `devtools supabase` is the Supabase CLI against the session's tier.
      # With no terminal the tier is never guessed, so it is named: the local
      # stack, whatever the runner's .env says.
      - name: Start the local Supabase stack
        run: pnpm devtools supabase start --tier development:local
      # `devtools supabase start` is the bare Supabase CLI, so unlike the old
      # `devtools db start` it writes no .env.generated. Write it here; with-env
      # only generates it for a session that finds the file missing, and the
      # next step sources it directly.
      - name: Write .env.generated from the running stack
        run: pnpm exec supabase status -o env > .env.generated
      # The Supabase half comes from .env.generated, so the suites and the
      # build run against a real Postgres and a real PostgREST rather than a
      # mock. The NEXT_PUBLIC pair is derived rather than hardcoded: it has to
      # match the running stack, and the CLI's local keys are not guaranteed
      # stable across versions. Written before the test suites, not just
      # before the build: schedule-builder's query hooks create the browser
      # Supabase client at import, so its db-tests need the pair too.
      - name: Synthetic environment for the suites and the build
        run: |
          cp .github/ci.env .env
          set -a; . ./.env.generated; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> .env
      # Catches a migration that changed the schema without the committed types
      # being regenerated -- which typechecks fine everywhere until something
      # reads a column the types still claim exists.
      - name: Generated Database types match the migrations
        run: pnpm --filter @devdogsuga/supabase run types:db:check
      # 59 tests. All app schemas share one PostgREST endpoint and one anon key,
      # so RLS -- not the schema boundary -- is what isolates one app's data from
      # another's. This is the only thing that checks it.
      - name: Row-Level Security
        run: pnpm --filter @devdogsuga/supabase run test:rls
      # 124 tests, including the privilege-surface guards in
      # resolveCredential.db-test.ts. Those assert the shape of the GRANTS, which
      # nothing else can see: a function reachable by every role in the cluster
      # typechecks perfectly.
      # `test:db` runs its app's `codegen` first (`pretest:db`), so there is
      # nothing to build beforehand.
      - name: Query validity + privilege surface
        run: pnpm --filter platform run test:db
      - name: Query validity + privilege surface (schedule-builder)
        run: pnpm --filter schedule-builder run test:db
      # Validation ENFORCED, unlike everywhere else in this file. That is what
      # makes this worth running: a newly added required variable with no
      # default fails here rather than at deploy time.
      #
      # Both Next apps. study-group-finder is Flutter and is covered by its own
      # job.
      - name: Build both Next apps, with the env schema enforced
        env:
          SKIP_ENV_VALIDATION: ""
        run: >-
          pnpm exec with-env
          pnpm -r --if-present --filter './apps/**' --filter '!study-group-finder' run build

  # Repo-wide formatting check — fast, no build needed.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - name: Prettier check
        run: pnpm format:check

  # Flutter app — only when it (or a shared dep) is affected.
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      # Turbo's `--affected --filter=study-group-finder --dry-run=json`
      # answered one question: does study-group-finder, or anything it
      # depends on, appear in the changed set since the merge base? pnpm has
      # no single flag for that, so this rebuilds it from two pieces: the
      # shared base-ref action, and `study-group-finder...` (pnpm's "package and
      # its dependencies" selector) to list exactly the directories whose
      # content decides this — the app itself, plus @devdogsuga/config,
      # @devdogsuga/env and @devdogsuga/supabase's actual resolved graph,
      # read from pnpm rather than hand-copied from a package.json that could
      # drift. A plain `git diff --quiet` over those directories since the
      # base ref is then exactly turbo's "changed or a dependency changed"
      # check.
      - id: base
        uses: ./.github/actions/base-ref
      - name: Is study-group-finder affected?
        id: affected
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          PATHS=$(pnpm -r --filter 'study-group-finder...' list --depth -1 --json 2>/dev/null \
            | node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c));
                process.stdin.on("end", () => {
                  for (const p of JSON.parse(d)) console.log(p.path);
                });
              ')
          if git diff --quiet "$BASE"...HEAD -- $PATHS; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.affected.outputs.run == 'true'
        with:
          channel: stable
          cache: true
      - name: Analyze + test
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/study-group-finder
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # A main commit becomes a staging/production candidate only after all four
  # required checks pass. Keeping this as a reusable workflow preserves the
  # credential boundary: PR runs never call it, and only this job receives the
  # Actions write permission needed to supersede older waiting candidates.
  deploy:
    needs: [validate, database, format, flutter]
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit

# Removed from this workflow, and not yet replaced:
#
#   * The `author_association` gates. Every contributor will be a COLLABORATOR,
#     so the condition passed by construction — protection in appearance only.
#     With no secrets in this file there is nothing left for it to protect.
#
# The gap recorded here has since been closed, credential-free:
#
#   * The local Supabase stack, as the `database` job above. A fresh runner
#     volume makes `supabase start` itself the from-scratch migration check, so
#     no separate `db reset` is needed.
#
# The test steps of the `database` job run under the workflow-wide
# SKIP_ENV_VALIDATION, so they do not prove the env schema -- .env.generated
# carries the local stack's values and nothing else. Its build step is the
# exception and turns validation back on.
#
# Both Next apps build here. An earlier revision of this file recorded
# schedule-builder as a known gap, on the strength of a test that hand-picked a
# subset of .env.generated rather than sourcing all of it -- FUNCTIONS_URL,
# GRAPHQL_URL, STORAGE_S3_URL and the S3_PROTOCOL_* trio were missing, and the
# app failed collecting page data. Given the whole file it builds. The gap was
# in the test, not the app.
