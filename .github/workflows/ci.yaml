name: CI

# Validation only. No deploys, and — deliberately — no secrets of any kind.
#
# That is the invariant this file exists to hold: on `pull_request`, GitHub runs
# the workflow definition FROM THE PULL REQUEST, not from the protected branch.
# Any credential in scope here is therefore readable by whoever opened the PR,
# and once contributors have push access their PRs are same-repo branches, which
# (unlike forks) are handed the repository's secrets. The only safe amount is
# none.
#
# Anything that genuinely needs a credential belongs after the merge gate, in
# the deploy workflow, or in the Cloudflare cron.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. The repository default is already `read`,
# but that is an org-level setting somebody can change without touching this
# file, so it is pinned here too.
permissions:
  contents: read

env:
  # The apps validate their whole env schema on import (@t3-oss/env), and CI has
  # no .env. Correct here; NEVER set on a real deploy build, where the schema is
  # exactly what should be enforced.
  SKIP_ENV_VALIDATION: "true"

# Actions are pinned to full commit SHAs rather than tags: a tag is mutable, and
# moving one is how a compromised action reaches every consumer at once. The
# trailing comment is what lets Dependabot keep them current.
jobs:
  # Lint + typecheck + test + build for the JS/TS packages affected by the change.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the base-ref diff below (affected-package
          # detection, done with a git-diff-backed pnpm `--filter
          # '...[<ref>]'` selector) has both ends of the comparison to work
          # with, whether that is a PR's base branch or the previous commit
          # on a push.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      # Turbo used to auto-detect this; pnpm's `[<since>]` filter needs the
      # ref named explicitly. A pull request diffs against the branch it
      # targets (its head may be several commits ahead of where it forked,
      # so the base branch's current tip is the right comparison point); a
      # push compares against the commit that `HEAD` pointed to before the
      # push landed, falling back to the previous commit if that value is
      # unset or unreachable (a repository's first push, or history pnpm
      # cannot see for another reason).
      - name: Determine base ref for affected-package detection
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="${{ github.event.pull_request.base.sha }}"
          else
            REF="${{ github.event.before }}"
            if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$REF" 2>/dev/null; then
              REF="HEAD~1"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # These are turbo's globalDependencies equivalents, but pnpm
          # attributes root-level files to the workspace root package, which
          # the filters below exclude -- a root-only change would otherwise
          # select nothing. Force the full package set when one changed.
          if git diff --quiet "$REF" HEAD -- tsconfig.base.json package.json pnpm-workspace.yaml pnpm-lock.yaml .npmrc; then
            echo "since=--filter=...[$REF]" >> "$GITHUB_OUTPUT"
          else
            echo "since=" >> "$GITHUB_OUTPUT"
          fi
      # Both apps' GENERATED route types (the `VinextRouteTypes` namespace,
      # next-env.d.ts's `vinext/types/augmentations` reference) exist on
      # every laptop that has ever run `vinext dev`/`vinext build` and on no
      # fresh checkout — `tsc --noEmit` then fails on names the framework
      # provides. `vinext typegen` (NOT `next typegen` — the two write
      # mutually incompatible shapes to the same `.next/types/routes.d.ts`
      # and `next-env.d.ts`; `next typegen` also strips next-env.d.ts's
      # `vinext/types/augmentations` import, which then breaks `tsc
      # --noEmit`) creates them without a build or a database;
      # next.config.ts falls back to a placeholder URL under
      # SKIP_ENV_VALIDATION so loading it here needs no credentials.
      # `pnpm --filter ... exec` runs only in that one package, so nothing
      # has compiled the workspace packages the Next configs import (`~/env`
      # reaches into @devdogsuga/env's dist/) — build the apps' dependencies
      # first, topologically, with pnpm's own `^...` (deps-of) selector.
      - name: Generate the vinext type stubs
        run: |
          pnpm -r --if-present --filter 'platform^...' --filter 'schedule-builder^...' run build
          pnpm --filter platform exec vinext typegen
          pnpm --filter schedule-builder exec vinext typegen
      # Flutter isn't installed here — the study-group-finder app is validated
      # in the `flutter` job below.
      #
      # `build` is NOT in this list, and its absence is the point. A Next
      # production build reads the environment whether or not the schema is
      # validated -- next.config.ts resolves image patterns against
      # NEXT_PUBLIC_SUPABASE_URL, and `new URL(path, undefined)` throws before
      # any page renders. SKIP_ENV_VALIDATION moves that failure; it does not
      # remove the requirement. Building the apps needs a database, so it
      # happens in the `database` job, which has one.
      #
      # pnpm has no single "run these tasks only against packages changed
      # since a ref, and their dependents, but build every dependency they
      # could reach so type-aware lint/typecheck have every .d.ts on disk"
      # command the way turbo's task graph did. `--filter './packages/**'
      # --filter './docs'` is deliberately a directory selector, not
      # `!<app-name>` exclusions: it builds every package UNDER apps' own
      # dependencies without ever running an app's OWN `build` script, which
      # is exactly what turbo's `^build` did too (typechecking `platform`
      # ran `platform`'s `typecheck` script and its DEPENDENCIES' `build`
      # scripts, never `platform`'s own `build`). That distinction matters
      # here specifically: this job sets SKIP_ENV_VALIDATION but has no .env
      # and no database, so `pnpm --filter platform run build`'s own
      # `_images` step reaching for `with-env` would fail outright, and a
      # broader "build everything, apps included" pre-step would too. It
      # also sidesteps the workspace-root recursion a `!`-exclusion-based
      # filter would otherwise risk: a directory selector never matches the
      # workspace root the way `!study-group-finder` alone would, so there is
      # no need to separately exclude `devdogs-monorepo`, whose own
      # `build`/`lint`/`typecheck`/`test` scripts are all `pnpm devtools run
      # <task>` — the exact command this step is replacing.
      #
      # This still costs more than turbo's per-task `^build` scoping would
      # have on a small-diff PR — every package under `packages/` and `docs`
      # builds regardless of which ones are actually affected, since pnpm has
      # no narrower "only the dependencies an affected app would reach"
      # selector — accepted here because turbo's remote cache was never
      # enabled and `.turbo` was never persisted across CI runs, so turbo was
      # already rebuilding all of it from nothing on every run; this only
      # makes that cost explicit. `--if-present` skips the packages with no
      # `build` script (`@devdogsuga/config`, `@devdogsuga/devtools`)
      # instead of failing on them.
      - name: Lint + typecheck + test (affected)
        run: |
          pnpm -r --if-present --filter './packages/**' --filter './docs' run build
          status=0
          pnpm -r --if-present ${{ steps.base.outputs.since }} --filter '!study-group-finder' --filter '!devdogs-monorepo' run lint || status=1
          pnpm -r --if-present ${{ steps.base.outputs.since }} --filter '!study-group-finder' --filter '!devdogs-monorepo' run typecheck || status=1
          pnpm -r --if-present ${{ steps.base.outputs.since }} --filter '!study-group-finder' --filter '!devdogs-monorepo' run test || status=1
          exit $status
      # The publishability gate for meetings and workshops: parses
      # data/meetings.json against the Zod schema and runs the validator
      # (lengths, the RSVP-host allowlist, cancellation pairing, id
      # uniqueness and shape). This is the ONLY validation those two tables
      # get now -- `reconcileFromConfig` trusts a config that reaches it and
      # aborts rather than refusing a single row, so a bad file has to be
      # caught here, not at runtime. Also covered by the lint/typecheck/test
      # step above via the package's own vitest suite; this step exercises
      # the CLI a config author actually runs.
      - name: Club config passes its publishability checks
        run: pnpm --filter @devdogsuga/club-config check
      # .env.example is GENERATED from the env manifests; this regenerates it
      # in memory and byte-compares -- the same pattern the database job uses
      # for database.types.ts. Credential-free by construction: the generator
      # is registry-only (no Bitwarden token, no network, no Docker).
      #
      # `with-env` reports a missing `.env` and continues rather than
      # refusing to start, so this job -- which deliberately does not have
      # one -- calls the one front door like everything else.
      #
      # Unconditional rather than --affected: any manifest edit anywhere can
      # change the output, and it costs about a second.
      - name: .env.example agrees with the env manifests
        run: pnpm devtools env example --check
      - name: Cloudflare binding types match the Worker configuration
        run: pnpm --filter platform cf:typegen:check && pnpm --filter schedule-builder cf:typegen:check
      # REMOVED: "Typecheck the deploy scripts" (`tsc -p scripts/tsconfig.json`).
      #
      # It existed because `scripts/` was not a workspace package, so the
      # lint/typecheck/test step could not see it — while the files in it
      # were the ones that composed production credentials and wrote Worker
      # secrets. All six are `devtools deploy` commands now, so they are
      # typechecked, linted and TESTED by the "Lint + typecheck + test
      # (affected)" step above, along with everything else in that package.
      # `scripts/` is gone with them; a step
      # pointed at an empty directory does not fail loudly, it fails as
      # TS18003 "no inputs were found", which reads like a broken config
      # rather than like a job with nothing to do.

  # Everything that needs a real Postgres: 139 tests CI has never run.
  #
  # Credential-free like the rest of this file, and not by exception — the local
  # stack's keys ARE the well-known constants Supabase publishes in its own
  # documentation. Nothing here can reach a real project.
  #
  # Unconditional rather than --affected, deliberately. Migrations and RLS are
  # the highest-consequence things in this repository, the whole job is a few
  # minutes, and a security check that skips itself on a heuristic is exactly
  # the failure mode this repository has already been bitten by: a job
  # guarded on `secrets.X != ''` that passed green for months without ever
  # running, because the secret it needed was never set.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # The runner's volume is always empty, so this applies every migration to
      # a fresh database and fails if any of them does not apply -- which is the
      # "migrations apply cleanly from scratch" check, with no separate reset
      # needed. Also writes .env.generated, which the suites below read.
      #
      # ⚠️ The devtools entrypoint and RLS suite run through `with-env`, which
      # REFUSES a missing .env by design. Seed it before the stack writes the
      # local connection overlay; the synthetic-environment step later replaces
      # this file and appends those generated values for the builds.
      - name: Seed the env file for wrapped checks
        run: cp .github/ci.env .env
      # config.toml enables four OAuth providers with `env()` credentials that
      # CI does not have. Verified: unset resolves to a WARN and exit 0, not an
      # error.
      - name: Start the local Supabase stack
        run: pnpm devtools db start
      # Catches a migration that changed the schema without the committed types
      # being regenerated -- which typechecks fine everywhere until something
      # reads a column the types still claim exists.
      - name: Generated Database types match the migrations
        run: |
          pnpm devtools db types
          git diff --exit-code -- packages/supabase/src/database.types.ts
      # 54 tests. All app schemas share one PostgREST endpoint and one anon key,
      # so RLS -- not the schema boundary -- is what isolates one app's data from
      # another's. This is the only thing that checks it.
      - name: Row-Level Security
        run: pnpm --filter @devdogsuga/supabase run test:rls
      # 85 tests, including the privilege-surface guards in
      # resolveCredential.db-test.ts. Those assert the shape of the GRANTS, which
      # nothing else can see: a function reachable by every role in the cluster
      # typechecks perfectly.
      # Vitest resolves @devdogsuga/drizzle and friends from their dist/,
      # which a fresh checkout doesn't have — the `pnpm --filter ... run`
      # invocation only runs in that one package, so build the app's
      # dependencies first with pnpm's own deps-of selector.
      - name: Query validity + privilege surface
        run: |
          pnpm -r --if-present --filter 'platform^...' run build
          pnpm --filter platform run test:db
      # Vitest resolves @devdogsuga/drizzle and friends from their dist/,
      # which a fresh checkout doesn't have — the `pnpm --filter ... run`
      # invocation only runs in that one package, so build the app's
      # dependencies first with pnpm's own deps-of selector.
      - name: Query validity + privilege surface (schedule-builder)
        run: |
          pnpm -r --if-present --filter 'schedule-builder^...' run build
          pnpm --filter schedule-builder run test:db
      # The Supabase half comes from .env.generated, so the build renders
      # against a real Postgres and a real PostgREST rather than a mock. The
      # NEXT_PUBLIC pair is derived rather than hardcoded: it has to match the
      # stack being rendered against, and the CLI's local keys are not
      # guaranteed stable across versions.
      - name: Synthetic environment for the build
        run: |
          cp .github/ci.env .env
          set -a; . ./.env.generated; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> .env
      # Validation ENFORCED, unlike everywhere else in this file. That is what
      # makes this worth running: a newly added required variable with no
      # default fails here rather than at deploy time.
      #
      # Both Next apps. study-group-finder is Flutter and is covered by its own
      # job.
      #
      # `--filter '!devdogs-monorepo'` alongside `!study-group-finder`: an
      # unqualified `!<name>` exclusion still matches the workspace root
      # (unlike a bare, filter-less `-r`, or a dependency-direction selector
      # like `^...`, both of which never do), and the root's own `build`
      # script is `pnpm devtools run build` — precisely the picker this
      # workflow bypasses everywhere else, so it must stay excluded here too.
      - name: Build both Next apps, with the env schema enforced
        env:
          SKIP_ENV_VALIDATION: ""
        run: >-
          pnpm exec with-env
          pnpm -r --if-present --filter '!study-group-finder' --filter '!devdogs-monorepo' run build

  # Repo-wide formatting check — fast, no build needed.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - name: Prettier check
        run: pnpm format:check

  # Flutter app — only when it (or a shared dep) is affected.
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      # Turbo's `--affected --filter=study-group-finder --dry-run=json`
      # answered one question: does study-group-finder, or anything it
      # depends on, appear in the changed set since the merge base? pnpm has
      # no single flag for that, so this rebuilds it from two pieces: the
      # same base-ref logic as the `validate` job's "Determine base ref" step
      # (duplicated rather than shared — jobs don't share step outputs, and
      # it's five lines), and `study-group-finder...` (pnpm's "package and
      # its dependencies" selector) to list exactly the directories whose
      # content decides this — the app itself, plus @devdogsuga/config,
      # @devdogsuga/env and @devdogsuga/supabase's actual resolved graph,
      # read from pnpm rather than hand-copied from a package.json that could
      # drift. A plain `git diff --quiet` over those directories since the
      # base ref is then exactly turbo's "changed or a dependency changed"
      # check.
      - name: Is study-group-finder affected?
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="HEAD~1"
            fi
          fi
          PATHS=$(pnpm -r --filter 'study-group-finder...' list --depth -1 --json 2>/dev/null \
            | node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c));
                process.stdin.on("end", () => {
                  for (const p of JSON.parse(d)) console.log(p.path);
                });
              ')
          if git diff --quiet "$BASE"...HEAD -- $PATHS; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.affected.outputs.run == 'true'
        with:
          channel: stable
          cache: true
      - name: Analyze + test
        if: steps.affected.outputs.run == 'true'
        working-directory: apps/study-group-finder
        run: |
          flutter pub get
          flutter analyze
          flutter test

# Removed from this workflow, and not yet replaced:
#
#   * The `author_association` gates. Every contributor will be a COLLABORATOR,
#     so the condition passed by construction — protection in appearance only.
#     With no secrets in this file there is nothing left for it to protect.
#
# The gap recorded here has since been closed, credential-free:
#
#   * The local Supabase stack, as the `database` job above. A fresh runner
#     volume makes `supabase start` itself the from-scratch migration check, so
#     no separate `db reset` is needed.
#
# The test steps of the `database` job run under the workflow-wide
# SKIP_ENV_VALIDATION, so they do not prove the env schema -- .env.generated
# carries the local stack's values and nothing else. Its build step is the
# exception and turns validation back on.
#
# Both Next apps build here. An earlier revision of this file recorded
# schedule-builder as a known gap, on the strength of a test that hand-picked a
# subset of .env.generated rather than sourcing all of it -- FUNCTIONS_URL,
# GRAPHQL_URL, STORAGE_S3_URL and the S3_PROTOCOL_* trio were missing, and the
# app failed collecting page data. Given the whole file it builds. The gap was
# in the test, not the app.
