name: Build artifacts

# The credential-free build of the platform Worker, plus the compiled docs, once per tier.
#
# Called from two places, and the same artifact comes out of both:
#
#   * ci.yaml, on `merge_group`: the merge queue builds the exact commit that
#     will land on `main`, so the artifacts exist before the merge.
#   * deploy.yaml, on a push to `main` that has no such run (an admin bypass
#     push, or expired artifacts): it builds for itself.
#
# Each tier runs in its own environment, `staging-build` / `production-build`:
# public variables only, no secrets, deployable from `main` and from the merge
# queue's `gh-readonly-queue/main/*` branches. Nothing in this workflow can
# reach a credential, and none is passed in by the callers.
#
# What a tier needs from its `<tier>-build` environment (variables):
#
#   API_URL                      the Supabase API URL
#   BASE_URL                     the platform's public origin
#   PUBLISHABLE_KEY              the Supabase publishable (anon) key
#   PLATFORM_SENTRY_DSN          optional: the platform's Sentry DSN
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY  optional: the Turnstile site key (public by design)
#
# `backstage env push --target <tier>` writes these, from the `build: true` flag
# on each key's `define()` in the env manifests; add a variable here and mark
# its key, not the environment. `check env` pins the set.
#
on:
  workflow_call:
    inputs:
      tiers:
        description: JSON array of tiers to build, e.g. ["staging","production"].
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ matrix.tier }}-build
    strategy:
      # One tier failing says nothing about the other.
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(inputs.tiers) }}
    env:
      DEPLOY_ENV: ${{ matrix.tier }}
      CLOUDFLARE_ENV: ${{ matrix.tier }}
      SKIP_ENV_VALIDATION: "1"
      # The build has no database to generate the Supabase types from, and no
      # use for them: every import of the `Database` type is `import type`,
      # erased before bundling. Typechecking (ci.yaml's `validate`) is what
      # reads them. See packages/supabase/scripts/codegen.ts.
      BACKSTAGE_SUPABASE_TYPES: skip
      API_URL: ${{ vars.API_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
      PLATFORM_SENTRY_DSN: ${{ vars.PLATFORM_SENTRY_DSN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-workspace
      # GitHub hands a missing variable to a workflow as an empty string. An
      # empty API_URL would build a Worker that fails on its first request, not
      # a build that fails, so refuse here and say which environment to fix.
      - name: Require the public build variables
        run: |
          missing=0
          for name in API_URL BASE_URL PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The $DEPLOY_ENV-build environment has no $name variable."
              missing=1
            fi
          done
          for name in PLATFORM_SENTRY_DSN NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::warning::The $DEPLOY_ENV-build environment has no $name variable; that feature is built disabled."
            fi
          done
          exit $missing
      # The platform consumes their workspace dependencies from `dist/`.
      - name: Build the apps' workspace dependencies
        run: pnpm --filter 'platform^...' --if-present run build
      # One file at the repo root, read by the platform and
      # `with-env`. Only public values, and the NEXT_PUBLIC_* copies the
      # browser bundles inline.
      - name: Compose public build configuration
        run: |
          umask 077
          {
            printf 'API_URL="%s"\n' "$API_URL"
            printf 'BASE_URL="%s"\n' "$BASE_URL"
            printf 'PUBLISHABLE_KEY="%s"\n' "$PUBLISHABLE_KEY"
            printf 'PLATFORM_SENTRY_DSN="%s"\n' "$PLATFORM_SENTRY_DSN"
            printf 'NEXT_PUBLIC_DEPLOY_ENV="%s"\n' "$DEPLOY_ENV"
            printf 'NEXT_PUBLIC_SUPABASE_URL="%s"\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_PLATFORM_SENTRY_DSN="%s"\n' "$PLATFORM_SENTRY_DSN"
            printf 'NEXT_PUBLIC_TURNSTILE_SITE_KEY="%s"\n' "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
            printf 'NEXT_PUBLIC_AVATARS_BUCKET="avatars"\n'
            printf 'NEXT_PUBLIC_AUTH_MODE="google"\n'
          } > ".env.$DEPLOY_ENV"
      # The browser bundle's Sentry release is the commit its server half
      # deploys with: this commit.
      - name: Build the platform without credentials
        env:
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm --filter platform run build
      - name: Reject accidental placeholder or credential-shaped values
        run: |
          set -euo pipefail
          if rg -uuu -l 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|SUPABASE_DB_PASSWORD|CLOUDFLARE_API_TOKEN' \
            apps/platform/dist; then
            echo "A $DEPLOY_ENV artifact contains credential-shaped material." >&2
            exit 1
          fi
      - name: Hash the exact candidate
        run: |
          find apps/platform/dist apps/platform/.wrangler/deploy \
            docs/dist \
            -type f -print0 | sort -z | xargs -0 sha256sum > RELEASE_SHA256SUMS
          {
            echo "### $DEPLOY_ENV artifacts"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '```'
            cat RELEASE_SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # docs/dist is what the platform's prebuild compiled; the deploy's
      # `populate:search` indexes it, so the search index matches the docs that
      # shipped.
      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.tier }}-${{ github.sha }}
          path: |
            apps/platform/dist
            apps/platform/.wrangler/deploy
            docs/dist
            RELEASE_SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
