name: Slides

# Builds the workshop deck. Separate from ci.yaml because the deck reads code
# from the private workshop repos (apps/slides/workshops/{web,mobile}), which
# the default GITHUB_TOKEN can't clone, and a slides failure shouldn't block
# a publish (publish.yaml waits on CI only).
#
# Needs the WORKSHOPS_READ_TOKEN secret: a fine-grained PAT with Contents:
# read on DevDogsUGA/DevDogsUGA (and DevDogsUGA/Backstage, until it is archived), web-workshops-planning and
# mobile-workshops-planning. Not available to PRs from forks, so those skip.
on:
  pull_request:
    paths:
      - apps/slides/**
      - packages/sdk/**
      - packages/events/**
      - .gitmodules
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - apps/slides/**
      - packages/sdk/**
      - packages/events/**
      - .gitmodules
      - pnpm-lock.yaml

concurrency:
  group: slides-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the deck resolves `step-N` imports by searching the
      # workshop repos' commit messages (HEAD^{/step N,}).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.WORKSHOPS_READ_TOKEN }}
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      # The step tags must match the deck (titles, commands, docs pages):
      # a deck change that alters them needs `pnpm tag-steps` and a push.
      - name: Check the workshop step tags
        run: |
          git -C apps/slides/workshops/web fetch --tags --force origin
          git -C apps/slides/workshops/mobile fetch --tags --force origin
          pnpm --filter slides tag-steps --check
      - name: Build the slides app and its workspace deps
        run: pnpm -r --filter 'slides...' --if-present run build

  # The hosted deck and live relay (slides-sync / slides-relay.devdogsuga.org),
  # through the shared deploy-worker.yaml like the other Workers: upload a
  # version, smoke test it on the relay host (no Cloudflare Access there, so the
  # check can reach the Worker: `/follow` must answer 426, and `/` must be
  # refused by the Worker's own Access check), switch traffic. It used to be
  # `pnpm run deploy` by hand.
  #
  # Production only (the deck has no staging tier), so it waits for the
  # `production` approval and, like the other production jobs, is off until the
  # repository variable BACKSTAGE_DEPLOYS_PRODUCTION is `true`.
  #
  # With ONE_APPROVAL=true `production` has no reviewers, so the deck asks the
  # same way the rest of production does: `production-approval` (the pause, in
  # the reviewed `production-approval` environment), then `deploy-approved`,
  # which is this same call plus `approval_environment`. Without the variable,
  # `deploy` asks through `production` as it always has. The two never both run.
  production-approval:
    needs: build
    if: >-
      github.event_name == 'push'
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL == 'true'
    uses: ./.github/workflows/approve-production.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      approval_environment: production-approval
      notes: |
        - Slides Worker (`devdogs-slides`): deploys the workshop deck; upload, smoke test, switch traffic.
      # The Worker job refuses a superseded candidate by its latest_paths below.
      require_latest: false

  deploy-approved:
    needs: [build, production-approval]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL == 'true'
      && needs.build.result == 'success'
      && needs.production-approval.result == 'success'
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: production
      approval_environment: production-approval
      tier: production
      use_wrangler_env: false
      worker_dir: apps/slides
      worker_name: devdogs-slides
      smoke_path: apps/slides
      workers_json: apps/slides/smoke.json
      checkout_submodules: true
      checkout_token_secret: true
      self_approval_gate: true
      require_latest: true
      latest_paths: |
        apps/slides/**
        packages/sdk/**
        packages/events/**
        .gitmodules
        pnpm-lock.yaml
      build_command: |
        pnpm -r --filter 'slides...' --if-present run build
        node apps/slides/scripts/strip-redirects.mjs

  deploy:
    needs: build
    if: >-
      github.event_name == 'push'
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && vars.ONE_APPROVAL != 'true'
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: production
      tier: production
      use_wrangler_env: false
      worker_dir: apps/slides
      worker_name: devdogs-slides
      smoke_path: apps/slides
      workers_json: apps/slides/smoke.json
      checkout_submodules: true
      checkout_token_secret: true
      self_approval_gate: true
      require_latest: true
      # Slides runs only on pushes that touch these paths (the `on.push.paths`
      # above), so a newer commit elsewhere has no Slides run to deploy the
      # change: only one that touches them supersedes this candidate.
      latest_paths: |
        apps/slides/**
        packages/sdk/**
        packages/events/**
        .gitmodules
        pnpm-lock.yaml
      build_command: |
        pnpm -r --filter 'slides...' --if-present run build
        node apps/slides/scripts/strip-redirects.mjs
