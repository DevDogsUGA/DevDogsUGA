name: study_group_finder
description: DevDogs Study Group Finder (Flutter) — shares the DevDogs Supabase
  project, owning the study_group_finder schema.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Reads this app's declarations for `docs-build gen`, which has no way to
  # analyze Dart from Node. Used only by `tool/docs_extract.dart`. Held at 13.x
  # because the Flutter SDK pins meta 1.18.0, which 14.x will not resolve
  # against — see the API notes at the top of that script.
  analyzer: ^13.0.0
  # Dart model generation from the shared Supabase schema (no official Dart
  # target in `supabase gen types`). Run via `pnpm --filter study-group-finder
  # generate-types`.
  supadart: ^1.9.3

flutter:
  uses-material-design: true
